<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Карточка товара в меню. ПК: цена и «В корзину» отдельно; если карточка узкая (container query) или компактная — цена на кнопке во всю ширину. Стили — .f-pcard* -->
<article data-reveal class="{{ cls }}">
  <div class="f-pcard__media" onClick="{{ open }}">
    <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ true }}"><img data-skel decoding="async" data-src="{{ img }}" alt="{{ name }}" style="width:100%;height:100%;object-fit:cover;display:block;filter:{{ imgFilter }}"></sc-if>
    <sc-if value="{{ noImg }}" hint-placeholder-val="{{ false }}"><span class="f-pcard__noimg">{{ noImgText }}</span></sc-if>
    <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}"><span class="f-pcard__badge">Разобрали</span></sc-if>
  </div>
  <div class="f-pcard__body">
    <h3 class="f-pcard__name" onClick="{{ open }}">{{ name }}</h3>
    <p class="f-pcard__desc">{{ desc }}</p>
  </div>
  <div class="f-pcard__foot">
    <sc-if value="{{ notInCart }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ big }}" hint-placeholder-val="{{ true }}"><span class="f-pcard__price">{{ price }}</span><button type="button" class="f-pcard__add" onClick="{{ add }}" aria-label="В корзину"><span class="f-pcard__add-label">В корзину</span><span class="f-pcard__add-price">{{ price }}</span></button></sc-if>
      <sc-if value="{{ small }}" hint-placeholder-val="{{ false }}"><button type="button" class="f-pcard__add" onClick="{{ add }}" aria-label="В корзину">{{ price }}</button></sc-if>
    </sc-if>
    <sc-if value="{{ inCart }}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{ big }}" hint-placeholder-val="{{ true }}"><span class="f-pcard__price">{{ price }}</span><dc-import name="FritoStepper" qty="{{ qty }}" on-inc="{{ inc }}" on-dec="{{ dec }}" size="{{ 44 }}" style="width:132px" hint-size="132px,44px"></dc-import></sc-if>
      <sc-if value="{{ small }}" hint-placeholder-val="{{ false }}"><dc-import name="FritoStepper" qty="{{ qty }}" on-inc="{{ inc }}" on-dec="{{ dec }}" size="{{ 44 }}" hint-size="100%,44px"></dc-import></sc-if>
    </sc-if>
    <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{ big }}" hint-placeholder-val="{{ true }}"><span class="f-pcard__price f-pcard__price--off">{{ price }}</span></sc-if>
      <span class="f-pcard__soldout">Нет в наличии</span>
    </sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 300, &quot;height&quot;: 420}, &quot;product&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;{ name, desc, img, hasImg, noImg, imgFilter, priceLabel, qty, notInCart, inCart, soldOut, open, add, inc, dec }&quot;}, &quot;compact&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, x = p.product || {}, c = !!p.compact;
    return {
      cls: 'f-comp f-pcard' + (c ? ' f-pcard--compact' : ''), big: !c, small: c,
      name: x.name ?? '', desc: x.desc ?? '', img: x.img ?? '', hasImg: !!x.hasImg, noImg: !!x.noImg, noImgText: c ? 'фото' : 'фото товара', imgFilter: x.imgFilter ?? 'none',
      price: x.priceLabel ?? '', qty: x.qty ?? 0, notInCart: !!x.notInCart, inCart: !!x.inCart, soldOut: !!x.soldOut,
      open: e => x.open && x.open(e), add: e => x.add && x.add(e), inc: () => x.inc && x.inc(), dec: () => x.dec && x.dec(),
    };
  }
}
</script>
</body>
</html>
