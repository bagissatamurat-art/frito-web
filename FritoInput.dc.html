<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<label style="position:relative;display:block;background:var(--surface-1);border-radius:14px;height:{{ h }};cursor:text;font-family:var(--font)">
  <span style="position:absolute;left:14px;top:{{ top }};font-size:{{ size }};color:var(--ink-2);font-weight:500;line-height:1;transition:all .15s;pointer-events:none;white-space:nowrap">{{ label }}<sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:var(--danger);margin-left:2px">*</span></sc-if></span>
  <sc-if value="{{ single }}" hint-placeholder-val="{{ true }}"><input value="{{ val }}" required="{{ req }}" aria-required="{{ req }}" type="{{ type }}" inputMode="{{ im }}" placeholder="{{ ph }}" maxLength="{{ maxLen }}" autoComplete="{{ ac }}" onChange="{{ change }}" onFocus="{{ focus }}" onBlur="{{ blur }}" style="position:absolute;left:14px;right:{{ rightPad }};bottom:9px;height:22px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:0;outline:none"></sc-if>
  <sc-if value="{{ multi }}" hint-placeholder-val="{{ false }}"><textarea value="{{ val }}" onChange="{{ change }}" onFocus="{{ focus }}" onBlur="{{ blur }}" style="position:absolute;left:14px;right:{{ rightPad }};top:28px;bottom:10px;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:0;resize:none;line-height:1.45;outline:none"></textarea></sc-if>
  <sc-if value="{{ showClear }}" hint-placeholder-val="{{ false }}"><button type="button" onMouseDown="{{ preventBlur }}" onClick="{{ clear }}" aria-label="Очистить" style="position:absolute;right:8px;top:{{ clearTop }};width:28px;height:28px;border:0;border-radius:50%;background:var(--surface-3);color:var(--ink-2);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background .15s" style-hover="background:var(--neutral-300);color:var(--ink)"><span aria-hidden="true" style="position:relative;width:10px;height:10px;display:block"><span style="position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:currentColor;border-radius:1px;transform:rotate(45deg)"></span><span style="position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:currentColor;border-radius:1px;transform:rotate(-45deg)"></span></span></button></sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:100},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Номер телефона&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;multiline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mask&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;phone&quot;,&quot;email&quot;],&quot;tsType&quot;:&quot;'none' | 'phone' | 'email'&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;clearable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;}}">
// Маска +7 (999) 999-99-99. Ведущая 8 (или 7 при вставке 11 цифр) без префикса +7 игнорируется.
const phoneDigits = raw => {
  const s = String(raw || '');
  let d = s.replace(/\D/g, '');
  if (/^\s*\+7/.test(s)) d = d.slice(1);
  else if (d.length >= 11 && /^[78]/.test(d)) d = d.slice(1);
  else if (d === '8') d = '';
  return d.slice(0, 10);
};
// Промежуточные состояния при ручном вводе префикса и международный режим:
// «+» и код страны не 7 → свободный формат до 15 цифр (E.164), группировка по 3.
const phoneRaw = raw => {
  const s = String(raw || '');
  if (s === '+') return '+';
  if (s === '+7') return '+7 (';
  if (/^\+[0-689]/.test(s)) {
    const d = s.replace(/\D/g, '').slice(0, 15);
    return '+' + d.replace(/(\d{3})(?=\d)/g, '$1 ');
  }
  return null;
};
const phoneFormat = d => {
  if (!d) return '';
  let out = '+7 (' + d.slice(0, 3);
  if (d.length > 3) out += ') ' + d.slice(3, 6);
  if (d.length > 6) out += '-' + d.slice(6, 8);
  if (d.length > 8) out += '-' + d.slice(8, 10);
  return out;
};
class Component extends DCLogic {
  state = { focus: false };
  renderVals() {
    const p = this.props, multi = !!p.multiline, phone = p.mask === 'phone', email = p.mask === 'email';
    const val = phone ? (phoneRaw(p.value) ?? (p.value === '+7 (' ? '+7 (' : phoneFormat(phoneDigits(p.value)))) : (p.value ?? '');
    const up = this.state.focus || String(val) !== '';
    return {
      label: p.label ?? '', req: !!p.required, val, single: !multi, multi, h: multi ? '84px' : '56px',
      top: up ? '10px' : (multi ? '16px' : '20px'), size: up ? '11px' : '15px',
      change: e => p.onChange && p.onChange(phone ? (phoneRaw(e.target.value) ?? phoneFormat(phoneDigits(e.target.value))) : e.target.value),
      ph: phone && this.state.focus ? '+7 (___) ___-__-__' : '', im: phone ? 'tel' : email ? 'email' : 'text', type: phone ? 'tel' : email ? 'email' : 'text', maxLen: phone ? 20 : 524288, ac: phone ? 'tel' : email ? 'email' : 'on',
      focus: () => this.setState({ focus: true }), blur: () => this.setState({ focus: false }),
      showClear: !phone && p.clearable !== false && String(val) !== '' && this.state.focus,
      rightPad: !phone && p.clearable !== false ? '44px' : '14px', clearTop: multi ? '10px' : '14px',
      clear: () => p.onChange && p.onChange(''), preventBlur: e => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
