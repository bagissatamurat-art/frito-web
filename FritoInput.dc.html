<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<label class="{{ cls }}">
  <span class="f-field__label">{{ label }}<sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span class="f-field__req" aria-hidden="true">*</span></sc-if></span>
  <sc-if value="{{ single }}" hint-placeholder-val="{{ true }}"><input class="f-field__input" value="{{ val }}" required="{{ req }}" aria-required="{{ req }}" type="{{ type }}" inputMode="{{ im }}" placeholder="{{ ph }}" maxLength="{{ maxLen }}" autoComplete="{{ ac }}" onChange="{{ change }}" onFocus="{{ focus }}" onBlur="{{ blur }}"></sc-if>
  <sc-if value="{{ multi }}" hint-placeholder-val="{{ false }}"><textarea class="f-field__area" value="{{ val }}" onChange="{{ change }}" onFocus="{{ focus }}" onBlur="{{ blur }}"></textarea></sc-if>
  <sc-if value="{{ showClear }}" hint-placeholder-val="{{ false }}"><button type="button" class="f-field__clear" onMouseDown="{{ preventBlur }}" onClick="{{ clear }}" aria-label="Очистить"><span class="f-x" aria-hidden="true"><span></span><span></span></span></button></sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:100},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Номер телефона&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;multiline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mask&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;phone&quot;,&quot;email&quot;],&quot;tsType&quot;:&quot;&#x27;none&#x27; | &#x27;phone&#x27; | &#x27;email&#x27;&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;clearable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
// Маска +7 (999) 999-99-99. Ведущая 8 (или 7 при вставке 11 цифр) без префикса +7 игнорируется.
const phoneDigits = raw => {
  const s = String(raw || '');
  let d = s.replace(/\D/g, '');
  if (/^\s*\+7/.test(s)) d = d.slice(1);
  else if (d.length >= 11 && /^[78]/.test(d)) d = d.slice(1);
  else if (d === '8') d = '';
  return d.slice(0, 10);
};
// Промежуточные состояния при ручном вводе префикса и международный режим:
// «+» и код страны не 7 → свободный формат до 15 цифр (E.164), группировка по 3.
const phoneRaw = raw => {
  const s = String(raw || '');
  if (s === '+') return '+';
  if (s === '+7') return '+7 (';
  if (/^\+[0-689]/.test(s)) {
    const d = s.replace(/\D/g, '').slice(0, 15);
    return '+' + d.replace(/(\d{3})(?=\d)/g, '$1 ');
  }
  return null;
};
const phoneFormat = d => {
  if (!d) return '';
  let out = '+7 (' + d.slice(0, 3);
  if (d.length > 3) out += ') ' + d.slice(3, 6);
  if (d.length > 6) out += '-' + d.slice(6, 8);
  if (d.length > 8) out += '-' + d.slice(8, 10);
  return out;
};
class Component extends DCLogic {
  state = { focus: false };
  renderVals() {
    const p = this.props, multi = !!p.multiline, phone = p.mask === 'phone', email = p.mask === 'email';
    const val = phone ? (phoneRaw(p.value) ?? (p.value === '+7 (' ? '+7 (' : phoneFormat(phoneDigits(p.value)))) : (p.value ?? '');
    const up = this.state.focus || String(val) !== '';
    return {
      label: p.label ?? '', req: !!p.required, val, single: !multi, multi,
      cls: 'f-field' + (multi ? ' f-field--multi' : '') + (up ? ' is-up' : '') + (!phone && p.clearable !== false ? ' f-field--clearable' : '') + (p.error ? ' is-error' : ''),
      change: e => p.onChange && p.onChange(phone ? (phoneRaw(e.target.value) ?? phoneFormat(phoneDigits(e.target.value))) : e.target.value),
      ph: phone && this.state.focus ? '+7 (___) ___-__-__' : '', im: phone ? 'tel' : email ? 'email' : 'text', type: phone ? 'tel' : email ? 'email' : 'text', maxLen: phone ? 20 : 524288, ac: phone ? 'tel' : email ? 'email' : 'on',
      focus: () => this.setState({ focus: true }), blur: () => this.setState({ focus: false }),
      showClear: !phone && p.clearable !== false && String(val) !== '' && this.state.focus,
      clear: () => p.onChange && p.onChange(''), preventBlur: e => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
