<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Строка заказа на оформлении: фото, название, количество, сумма. Стили — .f-orderline* -->
<div class="{{ cls }}">
  <div class="f-orderline__img"><img data-skel loading="lazy" decoding="async" src="{{ img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;filter:{{ imgFilter }}"></div>
  <div class="f-orderline__body"><span class="f-orderline__name" style="color:{{ nameColor }}">{{ name }}</span><sc-if value="{{ hasMods }}" hint-placeholder-val="{{ true }}"><span class="f-orderline__mods">{{ mods }}</span></sc-if><sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}"><span class="f-orderline__sold"><span class="f-dot-danger"></span>Разобрали</span></sc-if><span class="f-orderline__qty">{{ qtyLabel }}</span></div>
  <sc-if value="{{ ok }}" hint-placeholder-val="{{ true }}"><span class="f-orderline__price">{{ total }}</span></sc-if>
  <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}"><span class="f-orderline__price f-orderline__price--off">{{ total }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 64}, &quot;line&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;{ name, mods, hasMods, img, imgFilter, nameColor, qtyLabel, total, ok, soldOut }&quot;}, &quot;compact&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, l = p.line || {};
    return {
      cls: 'f-comp f-orderline' + (p.compact ? ' f-orderline--compact' : ''),
      name: l.name ?? '', mods: l.mods ?? '', hasMods: !!l.hasMods, img: l.img ?? '', imgFilter: l.imgFilter ?? 'none', nameColor: l.nameColor ?? 'var(--ink)',
      qtyLabel: l.qtyLabel ?? '', total: l.total ?? '', ok: !!l.ok, soldOut: !!l.soldOut,
    };
  }
}
</script>
</body>
</html>
