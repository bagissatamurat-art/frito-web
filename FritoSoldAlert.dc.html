<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Плашка «товар закончился» над списком товаров. Стили — .f-sold* в frito.css -->
<div class="{{ cls }}" role="alert">
  <span class="f-sold__icon" aria-hidden="true">!</span>
  <div class="f-sold__text">{{ text }}</div>
  <button type="button" class="f-sold__btn" onClick="{{ remove }}">Убрать</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 80}, &quot;text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Сальса бокс закончился — уберите его, чтобы оформить заказ&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;compact&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;onRemove&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { cls: 'f-comp f-sold' + (p.compact ? ' f-sold--compact' : ''), text: p.text ?? '', remove: () => p.onRemove && p.onRemove() };
  }
}
</script>
</body>
</html>
