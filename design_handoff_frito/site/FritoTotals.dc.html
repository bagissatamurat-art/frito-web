<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:{{ gap }};font-size:{{ fs }};color:#6B7280;font-family:Inter,system-ui,sans-serif">
  <div style="display:flex;justify-content:space-between"><span>Товары</span><span style="color:#111827;font-weight:600">{{ subtotalLabel }}</span></div>
  <div style="display:flex;justify-content:space-between"><span>{{ feeTitle }}</span><span style="color:#111827;font-weight:600">{{ feeLabel }}</span></div>
  <sc-if value="{{ hasDiscount }}" hint-placeholder-val="{{ true }}"><div style="display:flex;justify-content:space-between"><span>Скидка по промокоду</span><span style="color:#16A34A;font-weight:600">−{{ discountLabel }}</span></div></sc-if>
  <div style="border-top:1px solid #F1F1F4;padding-top:12px;margin-top:2px;display:flex;justify-content:space-between;align-items:baseline;color:#111827"><span style="font-size:{{ tfs }};font-weight:700">{{ totalTitle }}</span><span style="font-size:{{ tsum }};font-weight:800;letter-spacing:-.02em">{{ totalLabel }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:180},&quot;subtotal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9470,&quot;min&quot;:0,&quot;max&quot;:50000,&quot;step&quot;:10,&quot;unit&quot;:&quot;тг&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;fee&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:0,&quot;max&quot;:3000,&quot;step&quot;:50,&quot;unit&quot;:&quot;тг&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;discount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:947,&quot;min&quot;:0,&quot;max&quot;:10000,&quot;step&quot;:10,&quot;unit&quot;:&quot;тг&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;feeTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Доставка&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;totalTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Сумма заказа&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' тг.';
class Component extends DCLogic {
  renderVals() {
    const p = this.props, sub = p.subtotal ?? 0, fee = p.fee ?? 0, disc = p.discount ?? 0, compact = !!p.compact;
    return {
      subtotalLabel: fmt(sub), feeTitle: p.feeTitle ?? 'Доставка', feeLabel: fee === 0 ? 'Бесплатно' : fmt(fee),
      hasDiscount: disc > 0, discountLabel: fmt(disc), totalTitle: p.totalTitle ?? 'Сумма заказа', totalLabel: fmt(sub + fee - disc),
      gap: compact ? '8px' : '10px', fs: compact ? '13px' : '14px', tfs: compact ? '15px' : '16px', tsum: compact ? '20px' : '24px',
    };
  }
}
</script>
</body>
</html>
