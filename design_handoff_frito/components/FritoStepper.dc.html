<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:space-between;width:100%;height:{{ px }};font-family:Inter,system-ui,sans-serif">
  <button onClick="{{ onDec }}" aria-label="Меньше" style="border:0;background:#F3F4F6;color:#111827;width:{{ px }};height:{{ px }};border-radius:50%;font-size:20px;cursor:pointer;font:inherit;padding:0;display:flex;align-items:center;justify-content:center;line-height:1" style-hover="background:#E5E7EB">−</button>
  <span style="text-align:center;font-weight:700;font-size:16px;color:#111827">{{ qty }}</span>
  <button onClick="{{ onInc }}" aria-label="Больше" style="border:0;background:#F3F4F6;color:#111827;width:{{ px }};height:{{ px }};border-radius:50%;font-size:20px;cursor:pointer;font:inherit;padding:0;display:flex;align-items:center;justify-content:center;line-height:1" style-hover="background:#E5E7EB">+</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:60},&quot;qty&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:44,&quot;options&quot;:[40,42,44],&quot;tsType&quot;:&quot;number&quot;},&quot;onInc&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDec&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() { const p = this.props; return { px: (p.size ?? 44) + 'px', qty: p.qty ?? 1, onInc: p.onInc, onDec: p.onDec }; }
}
</script>
</body>
</html>
