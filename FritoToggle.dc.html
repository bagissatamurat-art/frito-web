<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button class="{{ cls }}" onClick="{{ toggle }}" role="switch" aria-checked="{{ on }}"><span class="f-toggle__knob"></span></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:48},&quot;on&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(on: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() { const p = this.props, on = !!p.on; return { on, cls: 'f-toggle' + (on ? ' is-on' : ''), toggle: () => p.onChange && p.onChange(!on) }; }
}
</script>
</body>
</html>
