<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="f-modal">
<sc-if value="{{ isCenter }}" hint-placeholder-val="{{ true }}">
  <div class="f-modal__center">
    <div class="f-overlay" onClick="{{ close }}"></div>
    <div class="f-dialog" role="dialog" aria-modal="true" style="padding-bottom:40px">
      <div class="f-modal__head">
        <div class="f-modal__titles"><h2 class="f-modal__title">Выберите способ получения заказа</h2><p class="f-modal__sub">{{ sub }}</p></div>
        <div class="f-modal__close"><dc-import name="FritoCloseButton" on-click="{{ close }}" style="width:48px;height:48px" hint-size="48px,48px"></dc-import></div>
      </div>
      <div class="f-options" style="margin-top:6px">
        <button class="f-option" onClick="{{ chooseDelivery }}"><img class="f-option__icon" src="assets/ic-delivery-p.svg" alt=""><span class="f-option__title">Доставка</span><span class="f-option__desc">Курьером за 35–45 мин · от 1 000 тг, бесплатно от 8 000 тг</span></button>
        <button class="f-option" onClick="{{ choosePickup }}"><img class="f-option__icon" src="assets/ic-pickup-p.svg" alt=""><span class="f-option__title">Самовывоз</span><span class="f-option__desc">5 ресторанов в Астане · готово через 15 мин · без доплаты</span></button>
      </div>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isSheet }}" hint-placeholder-val="{{ false }}">
  <div class="f-overlay" onClick="{{ close }}"></div>
  <div class="f-sheet" role="dialog" aria-modal="true" style="padding-bottom:34px;max-height:90%;box-shadow:none">
    <div class="f-grabber-wrap"><div class="f-grabber"></div></div>
      <div class="f-modal__head">
        <div class="f-modal__titles"><h2 class="f-modal__title">Выберите способ получения заказа</h2><p class="f-modal__sub">{{ sub }}</p></div>
        <div class="f-modal__close"><dc-import name="FritoCloseButton" on-click="{{ close }}" style="width:40px;height:40px" hint-size="40px,40px"></dc-import></div>
      </div>
    <div class="f-options">
        <button class="f-option" onClick="{{ chooseDelivery }}"><img class="f-option__icon" src="assets/ic-delivery-p.svg" alt=""><span class="f-option__title">Доставка</span><span class="f-option__desc">35–45 мин · бесплатно от 8 000 тг</span></button>
        <button class="f-option" onClick="{{ choosePickup }}"><img class="f-option__icon" src="assets/ic-pickup-p.svg" alt=""><span class="f-option__title">Самовывоз</span><span class="f-option__desc">5 ресторанов · через 15 мин</span></button>
    </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:560},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;center&quot;,&quot;options&quot;:[&quot;center&quot;,&quot;sheet&quot;],&quot;tsType&quot;:&quot;'center' | 'sheet'&quot;},&quot;pending&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onChoose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(mode: 'delivery' | 'pickup') =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.onKey = e => { if (e.key === 'Escape' && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const p = this.props, sheet = p.layout === 'sheet';
    return {
      isCenter: !sheet, isSheet: sheet,
      sub: p.pending ? 'Товар добавится в корзину сразу после выбора' : 'Адрес или ресторан можно будет уточнить дальше',
      close: () => p.onClose && p.onClose(),
      chooseDelivery: () => p.onChoose && p.onChoose('delivery'),
      choosePickup: () => p.onChoose && p.onChoose('pickup'),
    };
  }
}
</script>
</body>
</html>
