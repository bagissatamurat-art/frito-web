<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;color:#111827">
<sc-if value="{{ isCenter }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px">
    <div onClick="{{ close }}" style="position:absolute;inset:0;background:rgba(17,24,39,.45)"></div>
    <div role="dialog" aria-modal="true" style="position:relative;width:100%;max-width:560px;background:#fff;border-radius:32px;padding:36px 40px 40px;display:flex;flex-direction:column;gap:20px;box-shadow:0 40px 100px -30px rgba(0,0,0,.4)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <div style="display:flex;flex-direction:column;gap:10px">
          <h2 style="margin:0;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:pretty">Выберите способ получения заказа</h2>
          <p style="margin:0;font-size:17px;color:#6B7280;line-height:1.4">{{ sub }}</p>
        </div>
        <div style="flex-shrink:0;width:48px;height:48px"><dc-import name="FritoCloseButton" on-click="{{ close }}" style="width:48px;height:48px" hint-size="48px,48px"></dc-import></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px">
        <button onClick="{{ chooseDelivery }}" style="display:flex;flex-direction:column;align-items:stretch;gap:8px;border:2px solid #ECECF1;cursor:pointer;font:inherit;background:#F8F8FB;color:#111827;border-radius:24px;padding:18px;text-align:center;transition:border-color .15s,background .15s,transform .15s" style-hover="border-color:#614BE2;background:#F5F3FF;transform:translateY(-2px)">
          <img src="assets/ic-delivery-p.svg" alt="" style="width:48px;height:48px;object-fit:contain;align-self:center;margin:6px 0">
          <span style="font-size:19px;font-weight:700">Доставка</span>
          <span style="font-size:13px;color:#6B7280;line-height:1.35;flex:1">Курьером за 35–45 мин · от 1 000 тг, бесплатно от 8 000 тг</span>
        </button>
        <button onClick="{{ choosePickup }}" style="display:flex;flex-direction:column;align-items:stretch;gap:8px;border:2px solid #ECECF1;cursor:pointer;font:inherit;background:#F8F8FB;color:#111827;border-radius:24px;padding:18px;text-align:center;transition:border-color .15s,background .15s,transform .15s" style-hover="border-color:#614BE2;background:#F5F3FF;transform:translateY(-2px)">
          <img src="assets/ic-pickup-p.svg" alt="" style="width:48px;height:48px;object-fit:contain;align-self:center;margin:6px 0">
          <span style="font-size:19px;font-weight:700">Самовывоз</span>
          <span style="font-size:13px;color:#6B7280;line-height:1.35;flex:1">5 ресторанов в Астане · готово через 15 мин · без доплаты</span>
        </button>
      </div>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isSheet }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ close }}" style="position:absolute;inset:0;background:rgba(17,24,39,.45)"></div>
  <div role="dialog" aria-modal="true" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:18px;max-height:90%;overflow-y:auto">
    <div style="display:flex;justify-content:center"><div style="width:40px;height:4px;border-radius:2px;background:#E5E7EB"></div></div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <h2 style="margin:0;font-size:24px;font-weight:700;line-height:1.15;text-wrap:pretty">Выберите способ получения заказа</h2>
        <p style="margin:0;font-size:15px;color:#6B7280;line-height:1.4">{{ sub }}</p>
      </div>
      <div style="flex-shrink:0;width:40px;height:40px"><dc-import name="FritoCloseButton" on-click="{{ close }}" style="width:40px;height:40px" hint-size="40px,40px"></dc-import></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button onClick="{{ chooseDelivery }}" style="display:flex;flex-direction:column;align-items:stretch;gap:6px;border:2px solid #ECECF1;cursor:pointer;font:inherit;background:#F8F8FB;color:#111827;border-radius:22px;padding:14px 12px;text-align:center" style-active="border-color:#614BE2;background:#F5F3FF">
        <img src="assets/ic-delivery-p.svg" alt="" style="width:40px;height:40px;object-fit:contain;margin:4px auto">
        <span style="font-size:17px;font-weight:700">Доставка</span>
        <span style="font-size:12px;color:#6B7280;line-height:1.35;flex:1">35–45 мин · бесплатно от 8 000 тг</span>
      </button>
      <button onClick="{{ choosePickup }}" style="display:flex;flex-direction:column;align-items:stretch;gap:6px;border:2px solid #ECECF1;cursor:pointer;font:inherit;background:#F8F8FB;color:#111827;border-radius:22px;padding:14px 12px;text-align:center" style-active="border-color:#614BE2;background:#F5F3FF">
        <img src="assets/ic-pickup-p.svg" alt="" style="width:40px;height:40px;object-fit:contain;margin:4px auto">
        <span style="font-size:17px;font-weight:700">Самовывоз</span>
        <span style="font-size:12px;color:#6B7280;line-height:1.35;flex:1">5 ресторанов · через 15 мин</span>
      </button>
    </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:560},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;center&quot;,&quot;options&quot;:[&quot;center&quot;,&quot;sheet&quot;],&quot;tsType&quot;:&quot;'center' | 'sheet'&quot;},&quot;pending&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onChoose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(mode: 'delivery' | 'pickup') =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.onKey = e => { if (e.key === 'Escape' && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const p = this.props, sheet = p.layout === 'sheet';
    return {
      isCenter: !sheet, isSheet: sheet,
      sub: p.pending ? 'Товар добавится в корзину сразу после выбора' : 'Адрес или ресторан можно будет уточнить дальше',
      close: () => p.onClose && p.onClose(),
      chooseDelivery: () => p.onChoose && p.onChoose('delivery'),
      choosePickup: () => p.onChoose && p.onChoose('pickup'),
    };
  }
}
</script>
</body>
</html>
