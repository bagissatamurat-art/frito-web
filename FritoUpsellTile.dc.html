<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Плитка допродажи «Добавить к заказу?»: фото с плюсом, название (цена — если передана). Стили — .f-upsell* -->
<button type="button" class="{{ cls }}" onClick="{{ add }}" aria-label="{{ label }}">
  <span class="f-upsell__img"><img data-skel src="{{ img }}" alt="" class="f-cover-img"><span class="f-upsell__plus"><span aria-hidden="true" class="f-plus"><span></span><span></span></span></span></span>
  <span class="f-upsell__text"><span class="f-upsell__name">{{ name }}</span><sc-if value="{{ hasPrice }}" hint-placeholder-val="{{ false }}"><span class="f-upsell__price">{{ price }}</span></sc-if></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 120, &quot;height&quot;: 140}, &quot;item&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;{ img, short, priceLabel }&quot;}, &quot;compact&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;onAdd&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, u = p.item || {};
    return {
      cls: 'f-comp f-upsell' + (p.compact ? ' f-upsell--compact' : ''),
      img: u.img ?? '', name: u.short ?? '', price: u.priceLabel ?? '', hasPrice: !!u.priceLabel, label: (u.priceLabel ? 'Добавить: ' : 'Выбрать: ') + (u.short ?? ''),
      add: () => p.onAdd && p.onAdd(),
    };
  }
}
</script>
</body>
</html>
