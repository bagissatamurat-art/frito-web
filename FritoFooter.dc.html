<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#1B1740;border-radius:28px;padding:clamp(28px,4vw,40px) clamp(22px,4vw,40px) 28px;display:flex;flex-direction:column;gap:32px;color:#fff;font-family:Inter,system-ui,sans-serif">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:32px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:14px;max-width:360px">
      <sc-if value="{{ logoOk }}" hint-placeholder-val="{{ true }}"><img src="https://frito.kz/brand.svg" alt="FRITO" onError="{{ logoFail }}" style="height:34px;width:max-content;display:block;filter:brightness(0) invert(1)"></sc-if>
      <sc-if value="{{ logoBroken }}" hint-placeholder-val="{{ false }}"><div style="font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1">FRITO</div></sc-if>
      <p style="margin:0;font-size:13px;color:rgba(255,255,255,.6);line-height:1.5">Хрустящая курочка, бургеры и стрипсы. Доставка по Астане за 35–45 минут и самовывоз из пяти ресторанов.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <a href="tel:+77009380000" style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-.01em">+7 700 938 0000</a>
      <span style="font-size:13px;color:rgba(255,255,255,.55)">ежедневно 11:30 – 02:00</span>
      <div style="display:flex;gap:8px;margin-top:4px">
        <a href="https://wa.me/77009380000" aria-label="WhatsApp" style="width:44px;height:44px;border-radius:50%;background:#614BE2;display:flex;align-items:center;justify-content:center" style-hover="background:#503BCB"><img src="assets/ic-whatsapp-w.svg" alt="" style="width:20px;height:20px"></a>
        <a href="https://www.instagram.com/frito.kz/" aria-label="Instagram" style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,.18)"><img src="assets/ic-instagram-w.svg" alt="" style="width:20px;height:20px"></a>
        <a href="https://www.tiktok.com/@frito.kz" aria-label="TikTok" style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,.18)"><img src="assets/ic-tiktok-w.svg" alt="" style="width:32px;height:32px"></a>
      </div>
    </div>
  </div>
  <sc-if value="{{ showStores }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span style="font-size:13px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.04em">РЕСТОРАНЫ · {{ storeCount }}</span>
      <a href="#" style="font-size:13px;font-weight:600;color:#A899FF" style-hover="color:#fff">Все адреса на карте →</a>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ shown }}" as="st" hint-placeholder-count="5">
        <a href="#" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:999px;padding:8px 14px 8px 10px;color:#fff" style-hover="background:rgba(255,255,255,.12);color:#fff"><img src="assets/ic-pin-p.svg" alt="" style="width:14px;height:14px;filter:brightness(0) invert(1);opacity:.7"><span style="font-size:13px;font-weight:600;white-space:nowrap">{{ st.name }}</span><span style="font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap">{{ st.hours }}</span></a>
      </sc-for>
      <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}"><a href="#" style="display:flex;align-items:center;background:rgba(168,153,255,.15);border-radius:999px;padding:8px 14px;color:#A899FF;font-size:13px;font-weight:600">ещё {{ more }}</a></sc-if>
    </div>
  </div>
  </sc-if>
  <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap">
    <nav style="display:flex;gap:12px 24px;flex-wrap:wrap">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6"><a href="{{ l.href }}" style="font-size:13px;font-weight:500;color:rgba(255,255,255,.75)" style-hover="color:#fff">{{ l.label }}</a></sc-for>
    </nav>
    <span style="font-size:12px;color:rgba(255,255,255,.4)">© 2026 ТОО «Frito Restaurants» · Астана</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:420},&quot;stores&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{name:string,hours:string}[] | null&quot;},&quot;storesMax&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:1,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;showStores&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const LINKS = [
  { label: 'Франшиза', href: '#' }, { label: 'Поставщикам', href: '#' }, { label: 'Предложить помещение', href: '#' },
  { label: 'Вакансии', href: 'vacancies.dc.html' }, { label: 'Доставка и оплата', href: '#' }, { label: 'Оферта', href: '#' }, { label: 'Конфиденциальность', href: '#' },
];
class Component extends DCLogic {
  state = { logoBroken: false, stores: [] };
  async componentDidMount() {
    if (this.props.stores) return;
    try { const m = await import('./frito-data.js'); this.setState({ stores: m.STORES }); } catch (e) {}
  }
  renderVals() {
    const p = this.props, s = this.state;
    const stores = p.stores || s.stores, max = p.storesMax ?? 8;
    const shown = stores.slice(0, max), more = Math.max(0, stores.length - max);
    return {
      shown, more, hasMore: more > 0, storeCount: stores.length, showStores: p.showStores !== false && stores.length > 0,
      links: LINKS, logoOk: !s.logoBroken, logoBroken: s.logoBroken, logoFail: () => this.setState({ logoBroken: true }),
    };
  }
}
</script>
</body>
</html>
