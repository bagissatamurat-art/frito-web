<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Адресная «пилюля» в шапке: пустая (пунктир, открывает карту) или с адресом и «Изменить». Стили — .f-addr* -->
<sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="{{ emptyCls }}" onClick="{{ click }}"><span class="f-addr__icon f-addr__icon--white"><img src="assets/ic-pin-p.svg" alt="" class="f-addr__pin"></span><span class="f-addr__label">{{ placeholder }}</span><span class="f-addr__chev" aria-hidden="true">›</span></button>
</sc-if>
<sc-if value="{{ filled }}" hint-placeholder-val="{{ false }}">
  <button type="button" class="{{ filledCls }}" onClick="{{ click }}">
    <span class="f-addr__icon"><img src="assets/ic-pin-p.svg" alt="" class="f-addr__pin"></span>
    <span class="f-addr__text"><span class="f-addr__caption">{{ caption }}</span><span class="f-addr__value">{{ value }}</span></span>
    <span class="f-addr__change">Изменить</span>
  </button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 60}, &quot;filled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;caption&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Адрес доставки&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;placeholder&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Укажите адрес доставки&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;compact&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;onClick&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, c = p.compact ? ' f-addr--compact' : '';
    return {
      empty: !p.filled, filled: !!p.filled, emptyCls: 'f-comp f-addr f-addr--empty' + c, filledCls: 'f-comp f-addr' + c,
      caption: p.caption ?? '', value: p.value ?? '', placeholder: p.placeholder ?? 'Укажите адрес доставки',
      click: () => p.onClick && p.onClick(),
    };
  }
}
</script>
</body>
</html>
