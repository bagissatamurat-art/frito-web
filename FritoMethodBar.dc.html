<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Способ получения на главной: переключатель Доставка/Самовывоз (FritoSegment 36, без иконок) + строка адреса (.f-addr-btn).
     layout: stack (мобайл — карточка) | inline (шапка десктопа). Стили — .f-method* -->
<div class="{{ rootCls }}">
  <div class="f-method__seg"><dc-import name="FritoSegment" mode="{{ segMode }}" on-change="{{ pick }}" icons="{{ false }}" height="{{ 36 }}" hint-size="100%,44px"></dc-import></div>
  <button type="button" class="{{ addrCls }}" onClick="{{ open }}" aria-label="{{ aria }}">
    <span class="f-addr-btn__icon"><img src="{{ icon }}" alt=""></span>
    <span class="f-addr-btn__body"><span class="f-addr-btn__caption">{{ caption }}</span><span class="f-addr-btn__line">{{ line }}</span></span>
    <svg class="f-addr-btn__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:160},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;stack&quot;,&quot;options&quot;:[&quot;stack&quot;,&quot;inline&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;delivery&quot;,&quot;options&quot;:[&quot;delivery&quot;,&quot;pickup&quot;,&quot;&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;35–45 мин&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, has = !!p.mode && !!p.address, pick = p.mode === 'pickup';
    return {
      rootCls: 'f-comp f-method f-method--' + (p.layout === 'inline' ? 'inline' : 'stack'),
      segMode: p.mode || 'delivery', pick: m => p.onMode && p.onMode(m),
      addrCls: 'f-addr-btn f-method__addr' + (has ? '' : ' f-addr-btn--empty'),
      icon: pick ? 'assets/ic-pickup-p.svg' : 'assets/ic-pin-p.svg',
      caption: !has ? (pick ? 'Самовывоз' : 'Доставка') : pick ? 'Ресторан · готово за 15 мин' : 'Адрес доставки · ' + (p.eta || '35–45 мин'),
      line: has ? p.address : pick ? 'Выберите ресторан' : 'Укажите адрес доставки',
      aria: has ? 'Изменить ' + (pick ? 'ресторан' : 'адрес') : pick ? 'Выбрать ресторан' : 'Указать адрес',
      open: () => p.onOpen && p.onOpen(),
    };
  }
}
</script>
</body>
</html>
