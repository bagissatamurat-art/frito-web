<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="{{ cls }}">
  <div class="f-dbar__text"><span>{{ text }}</span><span class="f-dbar__from">{{ fromLabel }}</span></div>
  <div class="f-dbar__track"><div class="f-dbar__fill" style="width:{{ pct }}"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:80},&quot;subtotal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5200,&quot;min&quot;:0,&quot;max&quot;:30000,&quot;step&quot;:100,&quot;unit&quot;:&quot;₸&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;freeFrom&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8000,&quot;min&quot;:0,&quot;max&quot;:30000,&quot;step&quot;:500,&quot;unit&quot;:&quot;₸&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0₸';
class Component extends DCLogic {
  renderVals() {
    const p = this.props, sub = p.subtotal ?? 0, from = p.freeFrom ?? 8000, remain = Math.max(0, from - sub), compact = !!p.compact;
    return {
      text: remain === 0 ? 'Доставка бесплатно' : 'Ещё ' + fmt(remain) + ' до бесплатной доставки',
      fromLabel: 'от ' + fmt(from), pct: Math.min(100, Math.round(sub / from * 100)) + '%',
      cls: 'f-dbar' + (remain === 0 ? ' is-free' : '') + (compact ? ' f-dbar--compact' : ''),
    };
  }
}
</script>
</body>
</html>
