<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="f-modal">
<sc-if value="{{ isCenter }}" hint-placeholder-val="{{ true }}">
  <div class="f-modal__center">
    <div class="f-overlay" onClick="{{ close }}"></div>
    <div class="f-dialog f-dialog--flush f-pm" role="dialog" aria-modal="true" aria-label="{{ name }}">
      <div class="f-pm__media">
        <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ true }}"><img class="f-pm__img" data-skel src="{{ img }}" alt="{{ name }}"></sc-if>
        
      </div>
      <div class="f-pm__side">
        <dc-import name="FritoCloseButton" on-click="{{ close }}" style="position:absolute;top:24px;right:24px;z-index:2;width:48px;height:48px" hint-size="48px,48px"></dc-import>
        <div class="f-pm__body" ref="{{ bodyRef }}">
          <div class="f-pm__intro">
            <h2 class="f-modal__title">{{ name }}</h2>
            <div class="f-pm__price">{{ priceLabel }}</div>
            <p class="f-pm__desc">{{ desc }}</p>
            <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><p class="f-pm__note">{{ note }}</p></sc-if>
          </div>
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
            <div class="f-group" id="pm-g-{{ g.id }}">
              <div class="f-group__head">
                <div class="f-group__row">
                  <h3 class="f-group__title">{{ g.title }}</h3>
                  <sc-if value="{{ g.showReq }}" hint-placeholder-val="{{ false }}"><span class="f-tag f-tag--req">Обязательно</span></sc-if>
                  <sc-if value="{{ g.showOk }}" hint-placeholder-val="{{ false }}"><span class="f-tag f-tag--ok"><span class="f-tag__check">✓</span>Выбрано</span></sc-if>
                  <sc-if value="{{ g.showCount }}" hint-placeholder-val="{{ false }}"><span class="f-group__count">{{ g.countLabel }}</span></sc-if>
                </div>
                <div class="f-group__hint" style="color:{{ g.hintColor }};font-weight:{{ g.hintWeight }}">{{ g.hint }}</div>
              </div>
              <sc-if value="{{ g.isSeg }}" hint-placeholder-val="{{ false }}"><div class="f-mseg" role="radiogroup" aria-label="{{ g.title }}"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ o.selected }}" class="{{ o.segCls }}" onClick="{{ o.toggle }}"><sc-if value="{{ o.hot }}" hint-placeholder-val="{{ false }}"><svg class="f-mseg__chili" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.6 5.2c.4-1.5 1.5-2.6 3-2.9l.4 1.1c-1 .3-1.7.9-2 1.9 1.8.6 3 2.2 3 4.2 0 5.5-6.2 11.2-13.3 11.2-1.3 0-1.7-1.6-.6-2.2 4.4-2.4 6.2-6 6.6-9.6.2-2.1 1.7-3.7 2.9-3.7z"/></svg></sc-if>{{ o.short }}</button></sc-for></div></sc-if>
              <sc-if value="{{ g.isTiles }}" hint-placeholder-val="{{ false }}"><div class="f-mtiles" role="radiogroup" aria-label="{{ g.title }}"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{ o.selected }}" class="{{ o.tileCls }}" onClick="{{ o.toggle }}"><span class="f-mtile__img"><sc-if value="{{ o.hasImg }}" hint-placeholder-val="{{ true }}"><img data-src="{{ o.img }}" alt="" class="f-cover-img"></sc-if><span class="f-mtile__check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span><span class="f-mtile__name">{{ o.tileName }}</span><span class="f-mtile__vol">{{ o.vol }}</span></button></sc-for></div></sc-if>
              <sc-if value="{{ g.isChips }}" hint-placeholder-val="{{ false }}"><div class="f-mchips" role="group" aria-label="{{ g.title }}"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="3"><button type="button" role="checkbox" aria-checked="{{ o.selected }}" aria-disabled="{{ o.disabled }}" class="{{ o.chipCls }}" onClick="{{ o.toggle }}"><span class="f-mchip__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" class="f-mchip__plus"/><path d="M5 12h14" class="f-mchip__minus"/><path d="M5 12.5l4.5 4.5L19 7.5" class="f-mchip__ok"/></svg></span>{{ o.short }}<sc-if value="{{ o.hasPrice }}" hint-placeholder-val="{{ false }}"><span class="f-mchip__price">{{ o.priceLabel }}</span></sc-if></button></sc-for></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div class="f-pm__foot">
          <dc-import name="FritoStepper" qty="{{ qty }}" min="{{ 1 }}" on-inc="{{ inc }}" on-dec="{{ dec }}" size="{{ 56 }}" style="width:160px;flex-shrink:0" hint-size="160px,56px"></dc-import>
          <button class="f-cta" onClick="{{ submit }}"><span class="f-cta__label">{{ ctaLabel }}</span><span class="f-cta__right"><span class="f-cta__sep"></span><span class="f-cta__sum">{{ totalLabel }}</span></span></button>
        </div>
      </div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ isSheet }}" hint-placeholder-val="{{ false }}">
  <div class="f-overlay" onClick="{{ close }}"></div>
  <div class="f-sheet f-sheet--flush f-pm-sheet" role="dialog" aria-modal="true" aria-label="{{ name }}">
    <div class="f-pm__scroll" ref="{{ bodyRef }}">
      <div class="f-pm__media">
        <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ true }}"><img class="f-pm__img" data-skel src="{{ img }}" alt="{{ name }}"></sc-if>
        
        <div class="f-pm__grabber"></div>
      </div>
      <div class="f-pm__content">
          <div class="f-pm__intro">
            <h2 class="f-modal__title">{{ name }}</h2>
            <div class="f-pm__price">{{ priceLabel }}</div>
            <p class="f-pm__desc">{{ desc }}</p>
            <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><p class="f-pm__note">{{ note }}</p></sc-if>
          </div>
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
            <div class="f-group" id="pm-g-{{ g.id }}">
              <div class="f-group__head">
                <div class="f-group__row">
                  <h3 class="f-group__title">{{ g.title }}</h3>
                  <sc-if value="{{ g.showReq }}" hint-placeholder-val="{{ false }}"><span class="f-tag f-tag--req">Обязательно</span></sc-if>
                  <sc-if value="{{ g.showOk }}" hint-placeholder-val="{{ false }}"><span class="f-tag f-tag--ok"><span class="f-tag__check">✓</span>Выбрано</span></sc-if>
                  <sc-if value="{{ g.showCount }}" hint-placeholder-val="{{ false }}"><span class="f-group__count">{{ g.countLabel }}</span></sc-if>
                </div>
                <div class="f-group__hint" style="color:{{ g.hintColor }};font-weight:{{ g.hintWeight }}">{{ g.hint }}</div>
              </div>
              <sc-if value="{{ g.isSeg }}" hint-placeholder-val="{{ false }}"><div class="f-mseg" role="radiogroup" aria-label="{{ g.title }}"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ o.selected }}" class="{{ o.segCls }}" onClick="{{ o.toggle }}"><sc-if value="{{ o.hot }}" hint-placeholder-val="{{ false }}"><svg class="f-mseg__chili" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.6 5.2c.4-1.5 1.5-2.6 3-2.9l.4 1.1c-1 .3-1.7.9-2 1.9 1.8.6 3 2.2 3 4.2 0 5.5-6.2 11.2-13.3 11.2-1.3 0-1.7-1.6-.6-2.2 4.4-2.4 6.2-6 6.6-9.6.2-2.1 1.7-3.7 2.9-3.7z"/></svg></sc-if>{{ o.short }}</button></sc-for></div></sc-if>
              <sc-if value="{{ g.isTiles }}" hint-placeholder-val="{{ false }}"><div class="f-mtiles" role="radiogroup" aria-label="{{ g.title }}"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{ o.selected }}" class="{{ o.tileCls }}" onClick="{{ o.toggle }}"><span class="f-mtile__img"><sc-if value="{{ o.hasImg }}" hint-placeholder-val="{{ true }}"><img data-src="{{ o.img }}" alt="" class="f-cover-img"></sc-if><span class="f-mtile__check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span><span class="f-mtile__name">{{ o.tileName }}</span><span class="f-mtile__vol">{{ o.vol }}</span></button></sc-for></div></sc-if>
              <sc-if value="{{ g.isChips }}" hint-placeholder-val="{{ false }}"><div class="f-mchips" role="group" aria-label="{{ g.title }}"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="3"><button type="button" role="checkbox" aria-checked="{{ o.selected }}" aria-disabled="{{ o.disabled }}" class="{{ o.chipCls }}" onClick="{{ o.toggle }}"><span class="f-mchip__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" class="f-mchip__plus"/><path d="M5 12h14" class="f-mchip__minus"/><path d="M5 12.5l4.5 4.5L19 7.5" class="f-mchip__ok"/></svg></span>{{ o.short }}<sc-if value="{{ o.hasPrice }}" hint-placeholder-val="{{ false }}"><span class="f-mchip__price">{{ o.priceLabel }}</span></sc-if></button></sc-for></div></sc-if>
            </div>
          </sc-for>
      </div>
    </div>
    <dc-import name="FritoCloseButton" variant="float" on-click="{{ close }}" style="position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2;width:40px;height:40px" hint-size="40px,40px"></dc-import>
    <div class="f-pm__foot">
          <dc-import name="FritoStepper" qty="{{ qty }}" min="{{ 1 }}" on-inc="{{ inc }}" on-dec="{{ dec }}" size="{{ 56 }}" style="width:140px;flex-shrink:0" hint-size="140px,56px"></dc-import>
          <button class="f-cta" onClick="{{ submit }}"><span class="f-cta__label">{{ ctaLabel }}</span><span class="f-cta__right"><span class="f-cta__sep"></span><span class="f-cta__sum">{{ totalLabel }}</span></span></button>
        </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:800},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;center&quot;,&quot;options&quot;:[&quot;center&quot;,&quot;sheet&quot;],&quot;tsType&quot;:&quot;'center' | 'sheet'&quot;},&quot;preselect&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showErrors&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;add&quot;,&quot;options&quot;:[&quot;add&quot;,&quot;edit&quot;],&quot;tsType&quot;:&quot;'add' | 'edit'&quot;},&quot;qty&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;product&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{ id, name, price, desc, note?, img, kind?: 'box'|'combo'|'burger'|'strips'|'stripsCombo', groups?, sel? }&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(r: { id, qty, unit, mods, sel }) =&gt; void&quot;}}">
const IMG = 'https://16a9564f-f8ec-42ba-a998-3027aa809e50.selstorage.ru/frito-co/96814/images/items/';
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' тг.';
const opt = a => a.map(([id, label, price]) => ({ id, label, price: price || 0 }));
const G = {
  spiceB: { id: 'spice-b', title: 'Острота бургера', type: 'single', required: true, def: 'mild', options: opt([['mild', 'Неострый'], ['hot', 'Острый']]) },
  spiceS: { id: 'spice-s', title: 'Острота стрипсов', type: 'single', required: true, def: 'mild-s', options: opt([['mild-s', 'Неострые стрипсы'], ['hot-s', 'Острые стрипсы']]) },
  drink: { id: 'drink', title: 'Напиток', type: 'single', required: true, def: 'cola', view: 'tiles', options: opt([['cola', 'Coca-Cola 0,5 л'], ['fanta', 'Fanta 0,5 л'], ['sprite', 'Sprite 0,5 л'], ['fuse', 'Fuse-tea манго-ананас 0,5 л'], ['bonaqua', 'Bonaqua 0,5 л']]) },
  sauces: { id: 'sauces', title: 'Соусы', type: 'multi', max: 5, options: opt([['s-frito50', 'Соус Frito 50 мл', 250], ['s-frito30', 'Соус Frito 30 мл', 200], ['s-bbq', 'Соус барбекю Astoria дипод', 200], ['s-garlic', 'Соус чесночный Astoria дипод', 200], ['s-cheese', 'Соус сырный Astoria дипод', 200]]) },
  extra: { id: 'extra', title: 'Добавить в бургер', type: 'multi', max: 1, options: opt([['gouda', 'Сыр Гауда', 150]]) },
  remove: { id: 'remove', title: 'Убрать ингредиенты', type: 'multi', max: 2, options: opt([['no-sauce', 'Без соуса'], ['no-pickles', 'Без солёных огурцов']]) },
};
// фото вариантов (напитки) — плитки вместо списка
const OPT_IMG = { cola: 'b33fdd1975cc96cbfe2a3ac2edd7c7de.JPEG', fanta: '53cdae8ffbd7544bed6861a6ac547b06.PNG', sprite: 'eb4bcd36a03b7997d533e3d97c75c9e3.JPEG', fuse: '8eaf98fe05df54aadb3431e0cb49f88f.WEBP' };
// вид группы: 2–3 варианта «один из» → переключатель в строку, больше → плитки, «по желанию» → чипы
// короткая подпись на плитке/чипе (в корзину уходит полное название)
// объём напитка («0,5 л», «330 мл») — отдельной строкой в плитке
const volOf = l => (l.match(/\s(\d+(?:[,.]\d+)?\s?(?:л|мл))$/) || [])[1] || '';
const shortOf = l => { const t = l.replace(/ 0,5 л$/, '').replace(/ манго-ананас$/, '').replace(/ Astoria дипод$/, '').replace(/ стрипсы$/, '').replace(/^Соус /, ''); return t.charAt(0).toUpperCase() + t.slice(1); };
const viewOf = g => g.view || (g.type === 'single' ? (g.options.length <= 3 ? 'seg' : 'tiles') : 'chips');
const KINDS = { box: ['spiceB', 'spiceS', 'drink', 'sauces', 'extra', 'remove'], combo: ['spiceB', 'drink', 'sauces', 'extra', 'remove'], burger: ['spiceB', 'sauces', 'extra', 'remove'], strips: ['spiceS', 'sauces'], stripsCombo: ['spiceS', 'drink', 'sauces'] };
const DEFAULT_PRODUCT = { id: 'classic-box', name: 'Классический бокс', price: 3890, desc: 'Классический бургер, стрипсы (3 шт.), фри, фирменный соус Frito, напиток 0,5 л на выбор', note: 'Условия хранения: +1…+6 °C', img: IMG + 'd7ce2a28a1ab08cc33564ee0d8b718fb.JPEG', kind: 'box' };
const posWord = n => n % 10 === 1 && n % 100 !== 11 ? 'позиции' : 'позиций';

class Component extends DCLogic {
  state = { sel: null, qty: null, tried: false };
  bodyRef = React.createRef();
  componentDidMount() {
    this.onKey = e => { if (e.key === 'Escape' && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  componentDidUpdate(prev) {
    const a = prev.product && prev.product.id, b = this.props.product && this.props.product.id;
    if (a !== b) this.setState({ sel: null, qty: null, tried: false });
  }
  product() { return this.props.product || DEFAULT_PRODUCT; }
  groups() { const p = this.product(); return p.groups || (KINDS[p.kind] || []).map(k => G[k]); }
  defaults() {
    const p = this.product(); if (p.sel) return p.sel;
    const pre = this.props.preselect ?? true, o = {};
    this.groups().forEach(g => { o[g.id] = g.type === 'single' && pre && g.def ? [g.def] : []; });
    return o;
  }
  sel() { return this.state.sel || this.defaults(); }
  toggle(g, o) {
    const cur = this.sel(), list = cur[g.id] || [];
    let next;
    if (g.type === 'single') next = [o.id];
    else if (list.includes(o.id)) next = list.filter(x => x !== o.id);
    else { if (g.max && list.length >= g.max) return; next = [...list, o.id]; }
    this.setState({ sel: { ...cur, [g.id]: next } });
  }
  calc() {
    const sel = this.sel(), groups = this.groups(), base = this.product().price;
    let add = 0; const labels = [];
    groups.forEach(g => (sel[g.id] || []).forEach(id => { const o = g.options.find(x => x.id === id); if (o) { add += o.price; labels.push(o.label); } }));
    return { unit: base + add, mods: labels.join(' · '), missing: groups.filter(g => g.required && !(sel[g.id] || []).length) };
  }
  submit() {
    const c = this.calc();
    if (c.missing.length) {
      this.setState({ tried: true });
      const box = this.bodyRef.current, el = box && box.querySelector('#pm-g-' + c.missing[0].id);
      if (box && el) box.scrollTo({ top: el.offsetTop - 16, behavior: 'smooth' });
      return;
    }
    const qty = this.state.qty ?? this.props.qty ?? 1;
    this.props.onAdd && this.props.onAdd({ id: this.product().id, qty, unit: c.unit, mods: c.mods, sel: this.sel() });
  }
  renderVals() {
    const p = this.props, pr = this.product(), sel = this.sel(), c = this.calc();
    const tried = this.state.tried || !!p.showErrors, qty = this.state.qty ?? p.qty ?? 1, sheet = p.layout === 'sheet';
    const groups = this.groups().map(g => {
      const list = sel[g.id] || [], n = list.length, view = viewOf(g), err = g.required && !n && tried, full = g.type === 'multi' && g.max && n >= g.max;
      return {
        id: g.id, title: g.title, type: g.type === 'single' ? 'radio' : 'checkbox',
        showReq: g.required && !n, showOk: false, showCount: g.type === 'multi' && n > 0 && g.max > 1, countLabel: n + ' из ' + g.max,
        hint: err ? 'Выберите вариант, чтобы добавить в корзину' : g.type === 'single' ? '' : g.max > 1 ? 'По желанию · до ' + g.max + ' ' + posWord(g.max) : 'По желанию',
        hintColor: err ? 'var(--danger)' : 'var(--ink-2)', hintWeight: err ? 600 : 400,
        isSeg: view === 'seg', isTiles: view === 'tiles', isChips: view === 'chips',
        opts: g.options.map(o => { const on = list.includes(o.id), off = full && !on, img = o.img || (OPT_IMG[o.id] ? IMG + OPT_IMG[o.id] : '');
          return { label: o.label, short: shortOf(o.label), vol: volOf(o.label), tileName: shortOf(o.label).replace(/\s\d+(?:[,.]\d+)?\s?(?:л|мл)$/, ''), price: o.price, hasPrice: o.price > 0, priceLabel: '+' + fmt(o.price), selected: on, disabled: off,
            hot: /^hot/.test(o.id), img, hasImg: !!img, noImg: !img,
            segCls: 'f-mseg__btn' + (on ? ' is-on' : ''), tileCls: 'f-mtile' + (on ? ' is-on' : ''), chipCls: 'f-mchip' + (g.id === 'remove' ? ' f-mchip--minus' : '') + (on ? ' is-on' : '') + (off ? ' is-disabled' : ''),
            toggle: () => { if (!off) this.toggle(g, o); } }; }),
      };
    });
    return {
      isCenter: !sheet, isSheet: sheet, bodyRef: this.bodyRef,
      name: pr.name, priceLabel: fmt(pr.price), desc: pr.desc || '', note: pr.note || '', hasNote: !!pr.note,
      img: pr.img, hasImg: !!pr.img, noImg: !pr.img, groups,
      qty, inc: () => this.setState({ qty: qty + 1 }), dec: () => this.setState({ qty: Math.max(1, qty - 1) }),
      ctaLabel: p.mode === 'edit' ? 'Сохранить' : 'В корзину', totalLabel: fmt(c.unit * qty),
      close: () => p.onClose && p.onClose(), submit: () => this.submit(),
    };
  }
}
</script>
</body>
</html>
