<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Мини-карточка текущего заказа (главная, кабинет): время | этап + шкала | «Отследить». Страница заказа — FritoOrderStatus.
     Было: Прогресс заказа: этап крупно + время, шкала этапов, фото/адрес/кнопка. tone: brand (фиолетовая .f-brand-card) | light (белая панель).
     pct (0–1) + etaLabel — кольцо-таймер (страница заказа); etaLabel (+ etaNote) без pct — режим «крупно время»: подпись, большое число, примечание; title становится строкой этапа. onCta — кнопка действия внизу (напр. «Повторить заказ»), иначе cta — подпись-ссылка при onOpen. Используется: текущий заказ на главной и в кабинете, шапка страницы заказа. Стили — .f-progress* -->
<div class="{{ rootCls }}" role="{{ role }}" tabIndex="{{ tab }}" onClick="{{ open }}" onKeyDown="{{ key }}" aria-label="{{ aria }}">
  <sc-if value="{{ brand }}" hint-placeholder-val="{{ true }}"><span class="f-progress__shine" aria-hidden="true"></span></sc-if>
  <!-- sm — компактная строка для главной: время | этап + тонкая шкала | кнопка -->
  <sc-if value="{{ isSm }}" hint-placeholder-val="{{ false }}">
    <span class="f-progress__sm-eta"><span class="f-progress__sm-num">{{ eta }}</span><span class="f-progress__sm-unit">{{ smUnit }}</span></span>
    <span class="f-progress__sm-body">
      <span class="f-progress__caption">{{ caption }}</span>
      <span class="f-progress__sm-title">{{ title }}</span>
      <span class="f-progress__bar" aria-hidden="true"><sc-for list="{{ steps }}" as="st" hint-placeholder-count="4"><i class="{{ st.barCls }}"></i></sc-for></span>
    </span>
    <span class="{{ smCtaCls }}"><span class="f-progress__sm-cta-text">{{ cta }}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:260},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;brand&quot;,&quot;options&quot;:[&quot;brand&quot;,&quot;light&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Заказ №4821 · доставка&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Готовим ваш заказ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;~28&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;etaUnit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;мин&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{ label, time?, state: done|cur|todo|fail }[]&quot;},&quot;thumbs&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;addr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;md&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;lg&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const DEMO_STEPS = [{ label: 'Принят', state: 'done' }, { label: 'Готовим', state: 'cur' }, { label: 'В пути', state: 'todo' }, { label: 'Доставлен', state: 'todo' }];
class Component extends DCLogic {
  renderVals() {
    const p = this.props, steps = p.steps || DEMO_STEPS, link = !!p.onOpen, brand = (p.tone || 'brand') === 'brand';
    const thumbs = p.thumbs || [];
    return {
      brand,
      rootCls: 'f-comp f-progress ' + (brand ? 'f-brand-card f-progress--brand' : 'f-panel f-progress--light') + (p.size === 'lg' ? ' f-progress--lg' : p.size === 'sm' ? ' f-progress--sm' : '') + (p.alert ? ' is-alert' : '') + (link ? ' is-link' : ''),
      role: link ? 'link' : 'group', tab: link ? 0 : -1, aria: link ? 'Открыть заказ: ' + (p.title || '') : (p.title || ''),
      open: () => link && p.onOpen(), key: e => { if (link && e.key === 'Enter') p.onOpen(); },
      caption: p.caption || '', title: p.title || '', sub: p.sub || '', hasSub: !!p.sub,
      eta: p.eta || '', etaUnit: p.etaUnit || '', hasEta: !!(p.eta || p.etaUnit),
      isSm: p.size === 'sm', notSm: p.size !== 'sm', smUnit: p.etaUnit || '', smCtaCls: 'f-progress__sm-cta' + (brand ? '' : ' is-light'),
      hasRing: p.pct != null && !!p.etaLabel, noRing: !(p.pct != null && !!p.etaLabel),
      ringOff: (2 * Math.PI * 52 * (1 - Math.min(1, Math.max(0.04, +p.pct || 0)))).toFixed(1), ringNumCls: 'f-progress__ring-num' + (/^\d+$/.test(p.eta || '') ? '' : ' is-text'),
      hasHero: !!p.etaLabel, noHero: !p.etaLabel, etaLabel: p.etaLabel || '', etaNote: p.etaNote || '', hasNote: !!p.etaNote,
      n: steps.length,
      steps: steps.map(st => ({ label: st.label, time: st.time || '', hasTime: !!st.time, cls: 'f-progress__step is-' + (st.state || 'todo'), barCls: 'f-progress__seg is-' + (st.state || 'todo') })),
      thumbs, addr: p.addr || '', hasFoot: !!(thumbs.length || p.addr || p.cta || p.cta2), cta: p.cta || '', hasCta: !!p.cta && !p.onCta, hasBtn: !!p.cta && !!p.onCta,
      btnCls: 'f-btn f-btn--sm f-progress__btn ' + (brand ? 'f-btn--on-brand' : p.alert === 'pay' ? 'f-progress__btn--kaspi' : 'f-btn--primary'),
      cta2: p.cta2 || '', hasBtn2: !!p.cta2 && !!p.onCta2, btn2Cls: 'f-btn f-btn--sm f-btn--secondary f-progress__btn2', cta2Click: e => { if (e && e.stopPropagation) e.stopPropagation(); p.onCta2 && p.onCta2(); }, ctaClick: e => { if (e && e.stopPropagation) e.stopPropagation(); p.onCta && p.onCta(); },
      ctaCls: 'f-btn f-btn--xs f-progress__cta ' + (brand ? 'f-btn--on-brand' : 'f-btn--tonal'),
    };
  }
}
</script>
</body>
</html>
