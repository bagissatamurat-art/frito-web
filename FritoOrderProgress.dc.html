<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Прогресс заказа: этап крупно + время, шкала этапов, фото/адрес/кнопка. tone: brand (фиолетовая .f-brand-card) | light (белая панель).
     etaLabel (+ etaNote) — режим «крупно время»: подпись, большое число, примечание; title становится строкой этапа. onCta — кнопка действия внизу (напр. «Повторить заказ»), иначе cta — подпись-ссылка при onOpen. Используется: текущий заказ на главной и в кабинете, шапка страницы заказа. Стили — .f-progress* -->
<div class="{{ rootCls }}" role="{{ role }}" tabIndex="{{ tab }}" onClick="{{ open }}" onKeyDown="{{ key }}" aria-label="{{ aria }}">
  <sc-if value="{{ brand }}" hint-placeholder-val="{{ true }}"><span class="f-progress__shine" aria-hidden="true"></span></sc-if>
  <!-- герой: крупно время до доставки / готовности (etaLabel задан) -->
  <sc-if value="{{ hasHero }}" hint-placeholder-val="{{ false }}">
    <div class="f-progress__hero">
      <span class="f-progress__caption">{{ caption }}</span>
      <span class="f-progress__hero-label">{{ etaLabel }}</span>
      <span class="f-progress__hero-value"><span class="f-progress__hero-num">{{ eta }}</span><span class="f-progress__hero-unit">{{ etaUnit }}</span></span>
      <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ true }}"><span class="f-progress__hero-note">{{ etaNote }}</span></sc-if>
    </div>
    <span class="f-progress__stage">{{ title }}</span>
  </sc-if>
  <sc-if value="{{ noHero }}" hint-placeholder-val="{{ true }}">
  <div class="f-progress__top">
    <span class="f-progress__titles">
      <span class="f-progress__caption">{{ caption }}</span>
      <span class="f-progress__title">{{ title }}</span>
      <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}"><span class="f-progress__sub">{{ sub }}</span></sc-if>
    </span>
    <sc-if value="{{ hasEta }}" hint-placeholder-val="{{ true }}"><span class="f-progress__eta"><span class="f-progress__eta-v">{{ eta }}</span><span class="f-progress__eta-u">{{ etaUnit }}</span></span></sc-if>
  </div>
  </sc-if>
  <div class="f-progress__steps" style="grid-template-columns:repeat({{ n }},minmax(0,1fr))">
    <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4"><span class="{{ st.cls }}"><i class="f-progress__dot"></i><span class="f-progress__label">{{ st.label }}</span><sc-if value="{{ st.hasTime }}" hint-placeholder-val="{{ false }}"><span class="f-progress__time">{{ st.time }}</span></sc-if></span></sc-for>
  </div>
  <sc-if value="{{ hasFoot }}" hint-placeholder-val="{{ true }}">
    <div class="f-progress__foot">
      <span class="f-progress__thumbs"><sc-for list="{{ thumbs }}" as="th" hint-placeholder-count="3"><span class="f-progress__mini"><img data-skel src="{{ th }}" alt="" class="f-cover-img"></span></sc-for></span>
      <span class="f-progress__addr">{{ addr }}</span>
      <sc-if value="{{ hasBtn }}" hint-placeholder-val="{{ false }}"><button type="button" class="{{ btnCls }}" onClick="{{ ctaClick }}">{{ cta }}</button></sc-if>
      <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ true }}"><span class="{{ ctaCls }}">{{ cta }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:260},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;brand&quot;,&quot;options&quot;:[&quot;brand&quot;,&quot;light&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Заказ №4821 · доставка&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Готовим ваш заказ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;~28&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;etaUnit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;мин&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{ label, time?, state: done|cur|todo|fail }[]&quot;},&quot;thumbs&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;addr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;md&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;lg&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const DEMO_STEPS = [{ label: 'Принят', state: 'done' }, { label: 'Готовим', state: 'cur' }, { label: 'В пути', state: 'todo' }, { label: 'Доставлен', state: 'todo' }];
class Component extends DCLogic {
  renderVals() {
    const p = this.props, steps = p.steps || DEMO_STEPS, link = !!p.onOpen, brand = (p.tone || 'brand') === 'brand';
    const thumbs = p.thumbs || [];
    return {
      brand,
      rootCls: 'f-comp f-progress ' + (brand ? 'f-brand-card f-progress--brand' : 'f-panel f-progress--light') + (p.size === 'lg' ? ' f-progress--lg' : '') + (link ? ' is-link' : ''),
      role: link ? 'link' : 'group', tab: link ? 0 : -1, aria: link ? 'Открыть заказ: ' + (p.title || '') : (p.title || ''),
      open: () => link && p.onOpen(), key: e => { if (link && e.key === 'Enter') p.onOpen(); },
      caption: p.caption || '', title: p.title || '', sub: p.sub || '', hasSub: !!p.sub,
      eta: p.eta || '', etaUnit: p.etaUnit || '', hasEta: !!(p.eta || p.etaUnit),
      hasHero: !!p.etaLabel, noHero: !p.etaLabel, etaLabel: p.etaLabel || '', etaNote: p.etaNote || '', hasNote: !!p.etaNote,
      n: steps.length,
      steps: steps.map(st => ({ label: st.label, time: st.time || '', hasTime: !!st.time, cls: 'f-progress__step is-' + (st.state || 'todo') })),
      thumbs, addr: p.addr || '', hasFoot: !!(thumbs.length || p.addr || p.cta), cta: p.cta || '', hasCta: !!p.cta && !p.onCta, hasBtn: !!p.cta && !!p.onCta,
      btnCls: 'f-btn f-btn--sm f-progress__btn ' + (brand ? 'f-btn--on-brand' : 'f-btn--primary'), ctaClick: e => { if (e && e.stopPropagation) e.stopPropagation(); p.onCta && p.onCta(); },
      ctaCls: 'f-btn f-btn--xs f-progress__cta ' + (brand ? 'f-btn--on-brand' : 'f-btn--tonal'),
    };
  }
}
</script>
</body>
</html>
