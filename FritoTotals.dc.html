<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="{{ cls }}">
  <div class="f-totals__row"><span>Товары</span><span class="f-totals__val">{{ subtotalLabel }}</span></div>
  <div class="f-totals__row"><span>{{ feeTitle }}</span><span class="f-totals__val">{{ feeLabel }}</span></div>
  <sc-if value="{{ hasDiscount }}" hint-placeholder-val="{{ true }}"><div class="f-totals__row"><span>Скидка по промокоду</span><span class="f-totals__val f-totals__val--ok">−{{ discountLabel }}</span></div></sc-if>
  <div class="f-totals__total"><span class="f-totals__title">{{ totalTitle }}</span><span class="f-totals__sum">{{ totalLabel }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:180},&quot;subtotal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9470,&quot;min&quot;:0,&quot;max&quot;:50000,&quot;step&quot;:10,&quot;unit&quot;:&quot;₸&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;fee&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:0,&quot;max&quot;:3000,&quot;step&quot;:50,&quot;unit&quot;:&quot;₸&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;discount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:947,&quot;min&quot;:0,&quot;max&quot;:10000,&quot;step&quot;:10,&quot;unit&quot;:&quot;₸&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;feeTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Доставка&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;totalTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Сумма заказа&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0₸';
class Component extends DCLogic {
  renderVals() {
    const p = this.props, sub = p.subtotal ?? 0, fee = p.fee ?? 0, disc = p.discount ?? 0, compact = !!p.compact;
    return {
      subtotalLabel: fmt(sub), feeTitle: p.feeTitle ?? 'Доставка', feeLabel: fee === 0 ? 'Бесплатно' : fmt(fee),
      hasDiscount: disc > 0, discountLabel: fmt(disc), totalTitle: p.totalTitle ?? 'Сумма заказа', totalLabel: fmt(sub + fee - disc),
      cls: 'f-totals' + (compact ? ' f-totals--compact' : ''),
    };
  }
}
</script>
</body>
</html>
