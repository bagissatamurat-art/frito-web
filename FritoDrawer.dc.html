<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Боковое меню: аккаунт (вход / телефон), способ получения (.f-addr-btn как в корзине и оформлении), разделы, связь (WhatsApp и соцсети). Стили — .f-drawer* -->
<div class="{{ rootCls }}">
  <div class="f-drawer__head">
    <h2 class="f-drawer__title">Меню</h2>
    <div class="f-lang" role="group" aria-label="Язык · Тіл" data-no-i18n="">
      <button type="button" class="{{ ruCls }}" onClick="{{ toRu }}" aria-pressed="{{ isRu }}" lang="ru">Рус</button>
      <button type="button" class="{{ kkCls }}" onClick="{{ toKk }}" aria-pressed="{{ isKk }}" lang="kk">Қаз</button>
    </div>
    <div class="{{ closeCls }}"><dc-import name="FritoCloseButton" on-click="{{ close }}" style="width:100%;height:100%" hint-size="44px,44px"></dc-import></div>
  </div>
  <div class="f-drawer">
    <!-- аккаунт -->
    <sc-if value="{{ userIn }}" hint-placeholder-val="{{ false }}">
      <a class="f-drawer__user" href="account.dc.html">
        <span class="f-icon f-icon--solid"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>
        <span class="f-drawer__user-body"><span class="f-drawer__caption">Личный кабинет</span><span class="f-drawer__value">{{ userTitle }}</span></span>
        <span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      </a>
    </sc-if>
    <sc-if value="{{ guest }}" hint-placeholder-val="{{ true }}">
      <div class="f-drawer__login">
        <span class="f-drawer__login-text"><span class="f-drawer__value">Войдите в аккаунт</span><span class="f-drawer__caption">История заказов, адреса и повтор заказа в один клик</span></span>
        <button type="button" class="f-btn f-btn--primary f-btn--md f-btn--block" onClick="{{ login }}">Войти</button>
      </div>
    </sc-if>

    <!-- способ получения -->
    <section class="f-drawer__group">
      <span class="f-drawer__label">Как получить заказ</span>
      <button type="button" class="{{ addrCls }}" onClick="{{ method }}" aria-label="Изменить способ получения">
        <span class="f-addr-btn__icon"><img src="{{ methodIcon }}" alt=""></span>
        <span class="f-addr-btn__body"><span class="f-addr-btn__caption">{{ methodCaption }}</span><span class="f-addr-btn__line">{{ methodLine }}</span></span>
        <svg class="f-addr-btn__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </section>

    <!-- разделы -->
    <nav class="f-nav" aria-label="Разделы">
      <a class="f-nav__item" role="button" onClick="{{ close }}"><span class="f-icon f-icon--square"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16M5 11a7 7 0 0 1 14 0M3 15h18M6 15l1 4h10l1-4"/></svg></span><span class="f-nav__label">Меню</span><span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></a>
      <a class="f-nav__item" href="vacancies.dc.html"><span class="f-icon f-icon--square"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/></svg></span><span class="f-nav__label">Вакансии</span><span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></a>
    </nav>

    <!-- связь: звонков нет — WhatsApp, почта и соцсети. Данные — window.FritoContacts (frito.js) -->
    <section class="f-drawer__group f-drawer__contacts">
      <span class="f-drawer__label">Связаться с нами</span>
      <nav class="f-nav" aria-label="Контакты">
        <a class="f-nav__item" href="{{ c.waUrl }}" target="_blank" rel="noopener"><span class="f-icon f-icon--square f-icon--wa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.3L3.2 20.8l4.4-1.2A8.8 8.8 0 1 0 12 3.2z"/><path d="M9.2 8.3c-.4 0-.9.5-.9 1.3 0 2.6 3.4 6 6 6 .8 0 1.3-.5 1.3-.9v-.9l-1.8-.8-.9.9c-1.1-.5-2.1-1.5-2.6-2.6l.9-.9-.8-1.8z" fill="currentColor" stroke="none"/></svg></span><span class="f-nav__text"><span class="f-nav__label">WhatsApp</span><span class="f-nav__meta">Заказы и вопросы · {{ c.hours }}</span></span><span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg></span></a>
        <a class="f-nav__item" href="{{ c.mailUrl }}"><span class="f-icon f-icon--square f-icon--mail"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span><span class="f-nav__text"><span class="f-nav__label">Почта</span><span class="f-nav__meta">{{ c.email }}</span></span><span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg></span></a>
        <a class="f-nav__item" href="{{ c.instagramUrl }}" target="_blank" rel="noopener"><span class="f-icon f-icon--square f-icon--ig"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></span><span class="f-nav__text"><span class="f-nav__label">Instagram</span><span class="f-nav__meta">{{ c.instagramLabel }}</span></span><span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg></span></a>
        <a class="f-nav__item" href="{{ c.tiktokUrl }}" target="_blank" rel="noopener"><span class="f-icon f-icon--square f-icon--tt"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3h-3.3v12.2a2.9 2.9 0 1 1-2.1-2.8V9a6.3 6.3 0 1 0 5.4 6.2V9.1a7.6 7.6 0 0 0 4.4 1.4V7.2a4.4 4.4 0 0 1-4.4-4.2z"/></svg></span><span class="f-nav__text"><span class="f-nav__label">TikTok</span><span class="f-nav__meta">{{ c.tiktokLabel }}</span></span><span class="f-nav__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg></span></a>
      </nav>
    </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:860},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;user&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{ via, phone } | null&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;delivery&quot;,&quot;options&quot;:[&quot;delivery&quot;,&quot;pickup&quot;,&quot;&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ул. Алматы, 4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const VIA = { whatsapp: 'Вход через WhatsApp', telegram: 'Вход через Telegram' };
class Component extends DCLogic {
  renderVals() {
    const p = this.props, u = p.user, has = !!p.mode, deliv = p.mode !== 'pickup';
    const c = window.FritoContacts || {};
    return {
      c,
      // язык: «Рус / Қаз» — названия не переводятся (у кнопок свой lang)
      ...(() => { const kk = window.FritoI18n && FritoI18n.lang === 'kk', set = l => window.FritoI18n && FritoI18n.lang !== l && FritoI18n.set(l);
        return { isRu: !kk, isKk: kk, ruCls: 'f-lang__btn' + (kk ? '' : ' is-on'), kkCls: 'f-lang__btn' + (kk ? ' is-on' : ''), toRu: () => set('ru'), toKk: () => set('kk') }; })(),
      rootCls: 'f-comp f-drawer-root' + (p.compact ? ' f-drawer-root--compact' : ''),
      closeCls: 'f-drawer__close',
      close: () => p.onClose && p.onClose(),
      userIn: !!u, guest: !u, userTitle: u ? (u.name || u.phone || 'Аккаунт') : '', userVia: u ? (VIA[u.via] || 'Аккаунт') : '', userPhone: u ? (u.phone || 'Аккаунт') : '',
      login: () => p.onLogin && p.onLogin(), logout: () => p.onLogout && p.onLogout(),
      addrCls: 'f-addr-btn' + (has ? '' : ' f-addr-btn--empty'),
      methodIcon: has && !deliv ? 'assets/ic-pickup-p.svg' : 'assets/ic-delivery-p.svg',
      methodCaption: !has ? 'Доставка или самовывоз' : deliv ? 'Доставка · ' + (p.eta || '35–45 мин') : 'Самовывоз · готово за 15 мин',
      methodLine: has ? (p.address || '') : 'Укажите адрес доставки',
      method: () => p.onMethod && p.onMethod(),
    };
  }
}
</script>
</body>
</html>
