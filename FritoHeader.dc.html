<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- seo:start --><meta name="robots" content="noindex, nofollow"><!-- seo:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Единая шапка сайта: логотип (фиксированный размер — без прыжков) | слот по центру (вложенное содержимое dc-import, напр. FritoMethodBar) | справа: заголовок, «назад», меню.
     Стили — .f-header*. Используется на всех страницах. -->
<header class="f-comp f-header">
  <a class="f-header__brand" href="menu.dc.html" aria-label="Frito — на главную">
    <sc-if value="{{ logoOk }}" hint-placeholder-val="{{ true }}"><img src="https://frito.kz/brand.svg" alt="FRITO" width="109" height="34" onError="{{ logoFail }}" class="f-logo"></sc-if>
    <sc-if value="{{ logoBroken }}" hint-placeholder-val="{{ false }}"><span class="f-wordmark"><span class="f-wordmark__bolt"></span>FRITO</span></sc-if>
  </a>
  <sc-if value="{{ hasSlot }}" hint-placeholder-val="{{ false }}"><div class="f-header__center">{{ slot }}</div></sc-if>
  <div class="f-header__right">
    <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ false }}"><span class="f-header__title">{{ title }}</span></sc-if>
    <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}"><a class="f-header__back" href="{{ backHref }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>{{ backLabel }}</a></sc-if>
    <sc-if value="{{ hasMenu }}" hint-placeholder-val="{{ false }}"><button type="button" class="f-header__menu" onClick="{{ menu }}" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:72},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;В меню&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;menu.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { logoBroken: false };
  renderVals() {
    const p = this.props, s = this.state;
    return {
      title: p.title ?? '', hasTitle: !!p.title,
      hasBack: !!p.backLabel, backLabel: p.backLabel || '', backHref: p.backHref ?? 'menu.dc.html',
      hasMenu: !!p.onMenu, menu: () => p.onMenu && p.onMenu(),
      slot: p.children || null, hasSlot: !!p.children,
      logoOk: !s.logoBroken, logoBroken: s.logoBroken, logoFail: () => this.setState({ logoBroken: true }),
    };
  }
}
</script>
</body>
</html>
