<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,4vw,32px);height:72px;background:#fff;border-bottom:1px solid #ECECF1;font-family:Inter,system-ui,sans-serif">
  <a href="menu.dc.html" style="display:flex;align-items:center">
    <sc-if value="{{ logoOk }}" hint-placeholder-val="{{ true }}"><img src="https://frito.kz/brand.svg" alt="FRITO" onError="{{ logoFail }}" style="height:32px;display:block"></sc-if>
    <sc-if value="{{ logoBroken }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:8px;color:#614BE2;font-weight:800;font-size:26px;letter-spacing:-.02em"><span style="width:26px;height:30px;background:#614BE2;clip-path:polygon(45% 0,100% 0,60% 45%,85% 45%,20% 100%,40% 55%,10% 55%)"></span>FRITO</span></sc-if>
  </a>
  <div style="display:flex;align-items:center;gap:8px;min-width:0">
    <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;font-weight:600;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</span></sc-if>
    <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}"><a href="{{ backHref }}" style="display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:#F7F7F9;font-size:14px;font-weight:600;color:#111827;white-space:nowrap" style-hover="background:#ECECF1;color:#111827"><span aria-hidden="true" style="width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:2px"></span>{{ backLabel }}</a></sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:72},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;В меню&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;menu.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { logoBroken: false };
  renderVals() {
    const p = this.props, s = this.state;
    return {
      title: p.title ?? '', hasTitle: !!p.title,
      hasBack: p.backLabel !== '', backLabel: p.backLabel ?? 'В меню', backHref: p.backHref ?? 'menu.dc.html',
      logoOk: !s.logoBroken, logoBroken: s.logoBroken, logoFail: () => this.setState({ logoBroken: true }),
    };
  }
}
</script>
</body>
</html>
