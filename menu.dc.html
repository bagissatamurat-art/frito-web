<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="stylesheet" href="./frito.css">
<link rel="stylesheet" href="./menu.css">
<script src="./frito.js"></script>
<link rel="modulepreload" href="./frito-data.js">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@keyframes story-fill{from{width:0}to{width:100%}}
body{margin:0;background:#E9E8F0;}
a{color:#614BE2;text-decoration:none}a:hover{color:#4A36C4}
*{box-sizing:border-box}
::-webkit-scrollbar{width:0;height:0}
input::placeholder,textarea::placeholder{color:#9CA3AF}
input,textarea,button{outline:none}
input:focus-visible,textarea:focus-visible{outline:none}
</style>
</helmet>
<div class="mn-root">

<!-- ============ DESKTOP ============ -->
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><div>

<section data-screen-label="Desktop" class="mn-d">
  <header class="mn-d__header">
    <sc-if value="{{ logoOk }}" hint-placeholder-val="{{ true }}"><img src="https://frito.kz/brand.svg" alt="FRITO" onError="{{ logoFail }}" class="f-logo"></sc-if>
    <sc-if value="{{ logoBroken }}" hint-placeholder-val="{{ false }}"><div class="mn-wordmark"><span class="mn-wordmark__bolt"></span>FRITO</div></sc-if>
    <!-- delivery method: segmented + address -->
    <dc-import name="FritoSegment" mode="{{ segMode }}" on-change="{{ pickModeD }}" icons="{{ true }}" height="{{ 40 }}" style="margin-left:24px;width:280px;flex-shrink:0" hint-size="280px,48px"></dc-import>
    <dc-import name="FritoAddressPill" filled="{{ hasMethod }}" caption="{{ addrCaption }}" value="{{ address }}" on-click="{{ openMethodD }}" hint-size="280px,48px"></dc-import>
    <div class="mn-d__header-right">
      <button onClick="{{ openMenuD }}" aria-label="Меню" class="mn-burger">
        <span class="mn-burger__line"></span><span class="mn-burger__line"></span><span class="mn-burger__line"></span>
      </button>
    </div>
  </header>

  <div class="mn-d__cols">
    <!-- menu 2/3 -->
    <div ref="{{ dScrollRef }}" onScroll="{{ onDScroll }}" class="mn-d__scroll">
      <div class="mn-d__top">
        <div class="mn-stories">
          <img role="button" tabIndex="0" onClick="{{ openStoryD0 }}" src="assets/story-stores.png" alt="Заказ через WhatsApp" class="mn-story">
          <img role="button" tabIndex="0" onClick="{{ openStoryD1 }}" src="assets/story-new10.png" alt="NEW10 −10% в первый месяц работы сайта" class="mn-story">
          <img role="button" tabIndex="0" onClick="{{ openStoryD2 }}" src="assets/story-whatsapp.png" alt="Рестораны и часы работы" class="mn-story-30">
        </div>
      </div>
      <nav data-cat-nav class="mn-cats">
          <sc-for list="{{ cats }}" as="cat" hint-placeholder-count="8">
            <button data-idx="{{ cat.idx }}" onClick="{{ cat.goD }}" style="border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:500;padding:12px 22px;border-radius:999px;white-space:nowrap;background:{{ cat.dBg }};color:{{ cat.dColor }};transition:background .15s">{{ cat.name }}</button>
          </sc-for>
        </nav>
      <div class="mn-d__catalog">
        <sc-for list="{{ cats }}" as="cat" hint-placeholder-count="3">
          <div id="d-cat-{{ cat.idx }}" class="mn-cat">
            <h2 class="mn-cat__title">{{ cat.name }}</h2>
            <div class="mn-grid">
              <sc-for list="{{ cat.items }}" as="p" hint-placeholder-count="3">
                <dc-import name="FritoProductCard" product="{{ p }}" hint-size="100%,420px"></dc-import>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <!-- footer desktop -->
      <div class="mn-footer-wrap"><dc-import name="FritoFooter" hint-size="100%,420px"></dc-import></div>
    </div>

    <!-- cart 1/3 -->
    <aside class="mn-cart">
      <sc-if value="{{ dEmpty }}" hint-placeholder-val="{{ true }}">
        <div class="mn-cart__empty-head"><h2 class="mn-h-22">Корзина пуста</h2></div>
        <div class="mn-cart__empty">
          <img src="assets/bag-frito.png" alt="" class="mn-cart__bag">
          <p class="mn-cart__empty-text">Добавьте бокс или комбо — здесь появится сумма и кнопка оформления.</p>
          <sc-if value="{{ noMethod }}" hint-placeholder-val="{{ true }}">
            <div class="mn-cart__empty-actions">
              <button onClick="{{ pickDeliveryD }}" class="mn-chip-btn"><img src="assets/ic-delivery-p.svg" alt="" class="mn-icon-20">Доставка</button>
              <button onClick="{{ pickPickupD }}" class="mn-chip-btn"><img src="assets/ic-pickup-p.svg" alt="" class="mn-icon-20">Самовывоз</button>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ dFilled }}" hint-placeholder-val="{{ false }}">
        <div class="mn-cart__head">
          <h2 class="mn-cart__title">{{ dHeadline }}</h2>
        </div>
        <div class="mn-cart__body">
          <!-- адрес / ресторан: как на оформлении, нажатие открывает выбор -->
          <div class="f-panel">
            <button type="button" class="{{ dAddrCls }}" onClick="{{ openMethodD }}" aria-label="Изменить способ получения">
              <span class="f-addr-btn__icon"><img src="{{ methodIcon }}" alt=""></span>
              <span class="f-addr-btn__body">
                <span class="f-addr-btn__caption">{{ mAddrCaption }}</span>
                <span class="f-addr-btn__line">{{ mAddrLine }}</span>
              </span>
              <svg class="f-addr-btn__chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <!-- sold-out notice -->
          <sc-if value="{{ dHasSold }}" hint-placeholder-val="{{ false }}">
            <dc-import name="FritoSoldAlert" text="{{ dSoldText }}" on-remove="{{ dRemoveSold }}" hint-size="100%,60px"></dc-import>
          </sc-if>
          <!-- items -->
          <div class="mn-lines">
            <sc-for list="{{ dLines }}" as="l" hint-placeholder-count="3">
              <dc-import name="FritoCartLine" line="{{ l }}" hint-size="100%,144px"></dc-import>
            </sc-for>
          </div>
          <!-- upsell -->
          <div class="f-panel">
            <div class="f-panel__title">Добавить к заказу?</div>
            <div class="mn-upsell">
              <sc-for list="{{ upsell }}" as="u" hint-placeholder-count="3">
                <dc-import name="FritoUpsellTile" item="{{ u }}" on-add="{{ u.add }}" hint-size="92px,120px"></dc-import>
              </sc-for>
            </div>
          </div>
          <!-- promo -->
          <div class="f-panel f-panel--gap-12">
            <dc-import name="FritoPromoField" code="{{ promoCode }}" desc="{{ promoDesc }}" subtotal="{{ liveSub }}" on-apply="{{ setPromo }}" on-remove="{{ removePromo }}" hint-size="100%,44px"></dc-import>
            <sc-if value="{{ isDelivery }}" hint-placeholder-val="{{ true }}">
              <dc-import name="FritoDeliveryBar" subtotal="{{ liveSub }}" free-from="{{ freeFrom }}" hint-size="100%,60px"></dc-import>
            </sc-if>
          </div>
          <!-- totals -->
          <div class="f-panel f-panel--plain"><dc-import name="FritoTotals" subtotal="{{ liveSub }}" fee="{{ liveDel }}" discount="{{ liveDisc }}" fee-title="{{ modeLabel }}" hint-size="100%,140px"></dc-import></div>
        </div>
        <div class="mn-cart__foot">
          <button onClick="{{ checkoutD }}" style="width:100%;border:0;cursor:{{ checkoutCursor }};font:inherit;background:{{ checkoutBg }};color:{{ checkoutColor }};border-radius:999px;height:60px;padding:0 28px;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:16px;transition:background .15s"><span>Перейти к оформлению</span><span class="mn-cta__right"><span class="mn-cta__sep"></span><span class="mn-bold">{{ totalLabel }}</span></span></button>
        </div>
      </sc-if>
    </aside>
  </div>

  <!-- SIDE MENU desktop -->
  <sc-if value="{{ menuD }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" style="position:absolute;inset:0;background:var(--overlay);z-index:30;animation:{{ menuBdAnim }}"></div>
    <aside style="position:absolute;top:0;right:0;bottom:0;width:420px;background:#fff;z-index:31;display:flex;flex-direction:column;box-shadow:-30px 0 80px -30px rgba(17,24,39,.35);animation:{{ menuAsideAnim }}">
      <dc-import name="FritoDrawer" compact="{{ false }}" user="{{ drawerUser }}" mode="{{ drawerMode }}" address="{{ drawerAddr }}" eta="{{ drawerEta }}" on-close="{{ closeMenu }}" on-login="{{ loginD }}" on-logout="{{ logout }}" on-method="{{ menuMethodD }}" hint-size="100%,100%"></dc-import>
    </aside>
  </sc-if>

  <!-- MODAL: способ получения -->
  <sc-if value="{{ modalD }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:20;animation:{{ modalOutAnim }}"><dc-import name="FritoAddressModal" layout="center" start="{{ addrStart }}" mode="{{ addrStart }}" on-close="{{ closeModal }}" on-confirm="{{ confirmAddr }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
  <!-- MODAL: товар -->
  <sc-if value="{{ pmD }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:25;animation:{{ pmOutAnim }}"><dc-import name="FritoProductModal" layout="center" product="{{ pmProduct }}" qty="{{ pmQty }}" mode="{{ pmMode }}" on-close="{{ closePm }}" on-add="{{ pmAdd }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
  <!-- MODAL: вход перед оформлением -->
  <sc-if value="{{ authD }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:40;animation:{{ authOutAnim }}"><dc-import name="FritoAuthModal" layout="center" reason="{{ authReason }}" on-close="{{ closeAuth }}" on-done="{{ authDone }}" on-guest="{{ authGuest }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
  <!-- MODAL: выбор допов из «Добавить к заказу?» -->
  <sc-if value="{{ pickD }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:45;animation:{{ pickOutAnim }}"><dc-import name="FritoPickList" layout="center" title="{{ pickTitle }}" items="{{ pickItems }}" on-close="{{ closePick }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
</section>
</div></sc-if>

<!-- ============ MOBILE ============ -->
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}"><div>

<section data-screen-label="Mobile" class="mn-m">
  <div ref="{{ mScrollRef }}" onScroll="{{ onMScroll }}" class="mn-m__scroll">
    <div class="mn-m__top">
      <header class="mn-m__header">
        <sc-if value="{{ logoOk }}" hint-placeholder-val="{{ true }}"><img src="https://frito.kz/brand.svg" alt="FRITO" onError="{{ logoFail }}" class="f-logo"></sc-if>
        <sc-if value="{{ logoBroken }}" hint-placeholder-val="{{ false }}"><div class="mn-m-wordmark"><span class="mn-m-wordmark__bolt"></span>FRITO</div></sc-if>
        <div class="mn-m__header-right">
          <button onClick="{{ openMenuM }}" aria-label="Меню" class="mn-m-burger">
            <span class="mn-m-burger__line"></span><span class="mn-m-burger__line"></span><span class="mn-m-burger__line"></span>
          </button>
        </div>
      </header>
      <div class="mn-m__method">
        <dc-import name="FritoSegment" mode="{{ segMode }}" on-change="{{ pickModeM }}" icons="{{ true }}" height="{{ 44 }}" hint-size="100%,52px"></dc-import>
        <dc-import name="FritoAddressPill" filled="{{ hasMethod }}" caption="{{ addrCaptionM }}" value="{{ address }}" compact="{{ true }}" on-click="{{ openMethodM }}" hint-size="100%,48px"></dc-import>
      </div>
      <div class="mn-m-stories">
        <img role="button" tabIndex="0" onClick="{{ openStoryM0 }}" src="assets/story-stores.png" alt="Заказ через WhatsApp" class="mn-m-story">
        <img role="button" tabIndex="0" onClick="{{ openStoryM1 }}" src="assets/story-new10.png" alt="NEW10 −10% в первый месяц работы сайта" class="mn-m-story">
        <img role="button" tabIndex="0" onClick="{{ openStoryM2 }}" src="assets/story-whatsapp.png" alt="Рестораны и часы работы" class="mn-m-story-30">
      </div>
    </div>
    <nav data-cat-nav class="mn-m-cats">
        <sc-for list="{{ cats }}" as="cat" hint-placeholder-count="6">
          <button data-idx="{{ cat.idx }}" onClick="{{ cat.goM }}" style="border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:500;padding:10px 18px;border-radius:999px;white-space:nowrap;background:{{ cat.mBg }};color:{{ cat.mColor }};transition:background .15s">{{ cat.name }}</button>
        </sc-for>
      </nav>
    <div class="mn-m__catalog">
      <sc-for list="{{ cats }}" as="cat" hint-placeholder-count="3">
        <div id="m-cat-{{ cat.idx }}" class="mn-m-cat">
          <h2 class="mn-m-cat__title">{{ cat.name }}</h2>
          <div class="mn-m-grid">
            <sc-for list="{{ cat.items }}" as="p" hint-placeholder-count="2">
              <dc-import name="FritoProductCard" product="{{ p }}" compact="{{ true }}" hint-size="100%,300px"></dc-import>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <!-- footer mobile -->
    <div class="mn-m-footer-wrap"><dc-import name="FritoFooter" hint-size="100%,520px"></dc-import></div>
  </div>

  <!-- floating cart -->
  <sc-if value="{{ mClosed }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ openMobile }}" class="mn-fab" style-active="transform:scale(.96)">
      <img src="assets/bag-frito.png" alt="" class="mn-fab__bag">
      <span class="mn-fab__label">{{ pillLabel }}</span>
      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ false }}"><span class="mn-fab__count">{{ count }}</span></sc-if>
    </button>
  </sc-if>

  <!-- bottom sheet cart -->
  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMobile }}" style="position:absolute;inset:0;background:var(--overlay);z-index:6;animation:{{ cartBdAnim }}"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:7;background:{{ mSheetHeadBg }};border-radius:32px 32px 0 0;max-height:{{ mSheetMax }};height:{{ mSheetH }};display:flex;flex-direction:column;box-shadow:var(--shadow-sheet);overflow:hidden;animation:{{ cartSheetAnim }}">
      <div class="mn-m-sheet__grabber"><div class="mn-grabber-bar"></div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px 20px;background:{{ mSheetHeadBg }};border-radius:32px 32px 0 0">
        <h2 class="mn-h-20">{{ mHeadline }}</h2>
        <div class="mn-row-6">
          <button onClick="{{ closeMobile }}" class="mn-m-sheet__close"><span aria-hidden="true" class="mn-x14"><span class="mn-xl1"></span><span class="mn-xl2"></span></span></button>
        </div>
      </div>
      <sc-if value="{{ noItems }}" hint-placeholder-val="{{ true }}">
        <div class="mn-m-cart__empty">
          <img src="assets/bag-frito.png" alt="" class="mn-m-cart__bag">
          <p class="mn-m-cart__empty-text">Начните с бокса — в нём бургер, стрипсы, фри и напиток.</p>
          <sc-if value="{{ noMethod }}" hint-placeholder-val="{{ true }}">
            <div class="mn-m-cart__empty-actions">
              <button onClick="{{ pickDeliveryM }}" class="mn-m-chip-btn" style-active="background:#E4E0FA"><img src="assets/ic-delivery-p.svg" alt="" class="mn-icon-20">Доставка</button>
              <button onClick="{{ pickPickupM }}" class="mn-m-chip-btn" style-active="background:#E4E0FA"><img src="assets/ic-pickup-p.svg" alt="" class="mn-icon-20">Самовывоз</button>
            </div>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ false }}">
        <div class="mn-m-cart__body">
          <div class="f-panel f-panel--compact">
            <button type="button" class="{{ mAddrCls }}" onClick="{{ openMethodM }}" aria-label="Изменить способ получения">
              <span class="f-addr-btn__icon"><img src="{{ methodIcon }}" alt=""></span>
              <span class="f-addr-btn__body">
                <span class="f-addr-btn__caption">{{ mAddrCaption }}</span>
                <span class="f-addr-btn__line">{{ mAddrLine }}</span>
              </span>
              <svg class="f-addr-btn__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <sc-if value="{{ mHasSold }}" hint-placeholder-val="{{ false }}">
            <dc-import name="FritoSoldAlert" text="{{ mSoldText }}" compact="{{ true }}" on-remove="{{ mRemoveSold }}" hint-size="100%,56px"></dc-import>
          </sc-if>
          <div class="mn-m-lines">
          <sc-for list="{{ lines }}" as="l" hint-placeholder-count="2">
            <dc-import name="FritoCartLine" line="{{ l }}" compact="{{ true }}" hint-size="100%,120px"></dc-import>
          </sc-for>
          </div>
          <div class="f-panel f-panel--compact f-panel--gap-12">
            <div class="f-panel__title">Добавить к заказу?</div>
            <div class="mn-m-upsell">
              <sc-for list="{{ upsell }}" as="u" hint-placeholder-count="3">
                <dc-import name="FritoUpsellTile" item="{{ u }}" compact="{{ true }}" on-add="{{ u.addM }}" hint-size="80px,104px"></dc-import>
              </sc-for>
            </div>
          </div>
          <div class="f-panel f-panel--compact f-panel--gap-12">
            <dc-import name="FritoPromoField" code="{{ promoCode }}" desc="{{ promoDesc }}" subtotal="{{ liveSub }}" compact="{{ true }}" on-apply="{{ setPromo }}" on-remove="{{ removePromo }}" hint-size="100%,44px"></dc-import>
            <sc-if value="{{ isDelivery }}" hint-placeholder-val="{{ true }}">
              <dc-import name="FritoDeliveryBar" subtotal="{{ liveSub }}" free-from="{{ freeFrom }}" compact="{{ true }}" hint-size="100%,56px"></dc-import>
            </sc-if>
          </div>
          <div class="f-panel f-panel--compact f-panel--plain"><dc-import name="FritoTotals" subtotal="{{ liveSub }}" fee="{{ liveDel }}" discount="{{ liveDisc }}" fee-title="{{ modeLabel }}" compact="{{ true }}" hint-size="100%,120px"></dc-import></div>
        </div>
        <div class="mn-m-cart__foot">
          <button onClick="{{ checkoutM }}" style="width:100%;border:0;cursor:{{ checkoutCursorM }};font:inherit;background:{{ checkoutBgM }};color:{{ checkoutColorM }};border-radius:999px;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600"><span>Перейти к оформлению</span><span class="mn-m-cta__right"><span class="mn-m-cta__sep"></span><span class="mn-bold">{{ totalLabel }}</span></span></button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <!-- SIDE MENU mobile -->
  <sc-if value="{{ menuM }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" style="position:absolute;inset:0;background:var(--overlay);z-index:30;animation:{{ menuBdAnim }}"></div>
    <aside style="position:absolute;top:0;right:0;bottom:0;width:min(360px,88vw);background:#fff;z-index:31;display:flex;flex-direction:column;border-radius:28px 0 0 28px;padding-top:env(safe-area-inset-top);box-shadow:-30px 0 80px -30px rgba(17,24,39,.35);animation:{{ menuAsideAnim }}">
      <dc-import name="FritoDrawer" compact="{{ true }}" user="{{ drawerUser }}" mode="{{ drawerMode }}" address="{{ drawerAddr }}" eta="{{ drawerEta }}" on-close="{{ closeMenu }}" on-login="{{ loginM }}" on-logout="{{ logout }}" on-method="{{ menuMethodM }}" hint-size="100%,100%"></dc-import>
    </aside>
  </sc-if>

  <!-- MODAL: способ получения -->
  <sc-if value="{{ modalM }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:20;animation:{{ modalOutAnim }}"><dc-import name="FritoAddressModal" layout="sheet" start="{{ addrStart }}" mode="{{ addrStart }}" on-close="{{ closeModal }}" on-confirm="{{ confirmAddr }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
  <!-- MODAL: товар -->
  <sc-if value="{{ pmM }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:25;animation:{{ pmOutAnim }}"><dc-import name="FritoProductModal" layout="sheet" product="{{ pmProduct }}" qty="{{ pmQty }}" mode="{{ pmMode }}" on-close="{{ closePm }}" on-add="{{ pmAdd }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
  <!-- MODAL: вход перед оформлением -->
  <sc-if value="{{ authM }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:40;animation:{{ authOutAnim }}"><dc-import name="FritoAuthModal" layout="sheet" reason="{{ authReason }}" on-close="{{ closeAuth }}" on-done="{{ authDone }}" on-guest="{{ authGuest }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
  <!-- MODAL: выбор допов из «Добавить к заказу?» -->
  <sc-if value="{{ pickM }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:45;animation:{{ pickOutAnim }}"><dc-import name="FritoPickList" layout="sheet" title="{{ pickTitle }}" items="{{ pickItems }}" on-close="{{ closePick }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></div>
  </sc-if>
</section>
</div></sc-if>

<!-- STORIES viewer -->
<sc-if value="{{ storyOpen }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{ storyAlt }}" style="position:fixed;inset:0;z-index:100;background:rgba(10,8,30,.92);display:flex;align-items:center;justify-content:center;font-family:var(--font);animation:{{ storyBdAnim }}">
  <div onClick="{{ closeStory }}" class="mn-story-view__backdrop"></div>
  <div style="position:relative;height:{{ storyH }};aspect-ratio:9/16;max-width:100vw;border-radius:{{ storyRadius }};overflow:hidden;background:#5F4BE2;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:frito-pop .3s var(--ease) both">
    <img src="{{ storyImg }}" alt="{{ storyAlt }}" draggable="false" class="mn-story-view__img">
    <div class="mn-story-view__shade"></div>
    <div class="mn-story-view__bars">
      <sc-for list="{{ storyBars }}" as="b" hint-placeholder-count="3">
        <div class="mn-story-view__bar"><div style="height:100%;background:#fff;border-radius:2px;width:{{ b.w }};animation:{{ b.anim }}"></div></div>
      </sc-for>
    </div>
    <button type="button" onClick="{{ closeStory }}" aria-label="Закрыть" class="mn-story-view__close">×</button>
    <button type="button" onClick="{{ prevStory }}" aria-label="Предыдущая" class="mn-story-view__prev"></button>
    <button type="button" onClick="{{ nextStory }}" aria-label="Следующая" class="mn-story-view__next"></button>

      // method

      openMethodM: () => this.setState({ modal: 'method', modalTarget: 'm', pendingId: null, addrMode: s.mode || 'delivery' }),
      pickModeD: m => this.setState({ modal: 'method', modalTarget: 'd', pendingId: null, addrMode: m }),

      modalD: modalOpen && s.modalTarget === 'd', modalM: modalOpen && s.modalTarget === 'm',
      methodPending: !!s.pendingId,
      chooseMethod: m => m === 'delivery' ? this.finishMethod('delivery', DEFAULT_ADDR) : this.finishMethod('pickup', STORES[0].name),
      pmD: !!s.pm && s.pmTarget === 'd', pmM: !!s.pm && s.pmTarget === 'm',
      pmProduct: s.pm ? { ...BY_ID[s.pm], kind: kindOf(s.pm), sel: s.pmEdit ? s.sels[s.pm] : undefined } : null,

      chooseDelivery: () => this.finishMethod('delivery', DEFAULT_ADDR), choosePickup: () => this.finishMethod('pickup', STORES[0].name),
