<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isSoft }}" hint-placeholder-val="{{ true }}">
  <button type="button" onClick="{{ click }}" aria-label="{{ label }}" style="width:100%;height:100%;min-width:32px;min-height:32px;border:0;border-radius:50%;background:#F3F4F6;color:#111827;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s" style-hover="background:#E5E7EB" style-active="background:#D1D5DB"><span aria-hidden="true" style="position:relative;width:38%;height:38%;display:block"><span style="position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:currentColor;border-radius:1px;transform:rotate(45deg)"></span><span style="position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:currentColor;border-radius:1px;transform:rotate(-45deg)"></span></span></button>
</sc-if>
<sc-if value="{{ isFloat }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ click }}" aria-label="{{ label }}" style="width:100%;height:100%;min-width:32px;min-height:32px;border:0;border-radius:50%;background:#fff;color:#111827;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(17,24,39,.15);transition:box-shadow .15s" style-hover="box-shadow:0 4px 14px rgba(17,24,39,.22)" style-active="background:#F3F4F6"><span aria-hidden="true" style="position:relative;width:38%;height:38%;display:block"><span style="position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:currentColor;border-radius:1px;transform:rotate(45deg)"></span><span style="position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:currentColor;border-radius:1px;transform:rotate(-45deg)"></span></span></button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;soft&quot;,&quot;options&quot;:[&quot;soft&quot;,&quot;float&quot;],&quot;tsType&quot;:&quot;'soft' | 'float'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Закрыть&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, float = p.variant === 'float';
    return { isSoft: !float, isFloat: float, label: p.label || 'Закрыть', click: e => p.onClick && p.onClick(e) };
  }
}
</script>
</body>
</html>
