<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./frito.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Оценка заказа: звёзды → готовые теги → отзыв → «Спасибо». Фирменная карточка .f-brand-card, стили — .f-rate*.
     Хранит оценку в localStorage.frito_ratings[orderNo] = { stars, tags, comment, at } — общая для кабинета и страницы заказа -->
<section class="{{ rootCls }}" aria-label="Оценка заказа">
  <sc-if value="{{ closable }}" hint-placeholder-val="{{ false }}"><div class="f-rate__close"><dc-import name="FritoCloseButton" variant="float" on-click="{{ close }}" style="width:40px;height:40px" hint-size="40px,40px"></dc-import></div></sc-if>
  <sc-if value="{{ notRated }}" hint-placeholder-val="{{ true }}">
    <div class="f-rate__head"><h2 class="f-rate__title">{{ title }}</h2><span class="f-rate__sub">{{ sub }}</span></div>
    <div class="f-rate__stars" role="radiogroup" aria-label="Оценка от 1 до 5">
      <sc-for list="{{ stars }}" as="st" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{ st.on }}" class="{{ st.cls }}" onClick="{{ st.pick }}" aria-label="{{ st.label }}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.85 5.8 6.4.93-4.63 4.5 1.1 6.37L12 17.4l-5.72 3 1.1-6.37-4.63-4.5 6.4-.93z"/></svg></button>
      </sc-for>
    </div>
    <sc-if value="{{ hasStars }}" hint-placeholder-val="{{ false }}">
      <div class="f-rate__form">
        <span class="f-rate__q">{{ tagsTitle }}</span>
        <div class="f-rate__tags">
          <sc-for list="{{ tags }}" as="tg" hint-placeholder-count="4"><button type="button" class="{{ tg.cls }}" aria-pressed="{{ tg.on }}" onClick="{{ tg.toggle }}">{{ tg.label }}</button></sc-for>
        </div>
        <label class="f-rate__field">
          <span class="f-rate__label">Отзыв</span>
          <textarea value="{{ comment }}" onChange="{{ setComment }}" maxLength="500" rows="3" placeholder="{{ commentPh }}" class="f-rate__area"></textarea>
          <span class="f-rate__count">{{ commentCount }}</span>
        </label>
        <button type="button" class="f-btn f-btn--on-brand f-rate__send" onClick="{{ send }}">Отправить оценку</button>
      </div>
    </sc-if>
  </sc-if>
  <sc-if value="{{ rated }}" hint-placeholder-val="{{ false }}">
    <div class="f-rate__done">
      <span class="f-rate__done-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="f-rate__done-text"><span class="f-rate__done-title">Спасибо за оценку!</span><span class="f-rate__done-sub">{{ ratedSub }}</span></span>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:520},&quot;orderNo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4793&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Как вам заказ?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stars&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;closable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const TAGS_GOOD = ['Вкусно', 'Горячее', 'Быстро', 'Вежливый курьер', 'Аккуратно упаковано'];
const TAGS_BAD = ['Остыло', 'Долго', 'Не всё привезли', 'Невкусно', 'Помялась упаковка'];
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
class Component extends DCLogic {
  state = (() => { const r = this.props.orderNo && (readJSON('frito_ratings') || {})[this.props.orderNo];
    return { stars: r ? r.stars : (this.props.stars || 0), tags: {}, comment: '', rated: !!r }; })();
  renderVals() {
    const p = this.props, s = this.state, good = s.stars >= 4, pool = good ? TAGS_GOOD : TAGS_BAD;
    return {
      rootCls: 'f-comp f-brand-card f-rate' + (p.compact ? ' f-rate--compact' : ''),
      closable: !!p.closable, close: () => p.onClose && p.onClose(),
      title: p.title || 'Как вам заказ?', sub: p.sub || 'Оценка займёт 10 секунд и поможет нам готовить ещё вкуснее',
      notRated: !s.rated, rated: s.rated, hasStars: s.stars > 0,
      stars: [1, 2, 3, 4, 5].map(n => ({ on: n <= s.stars, label: n + ' из 5', cls: 'f-rate__star' + (n <= s.stars ? ' is-on' : ''), pick: () => this.setState({ stars: n, tags: {} }) })),
      tagsTitle: good ? 'Что понравилось?' : 'Что пошло не так?',
      tags: pool.map(t => { const on = !!s.tags[t]; return { label: t, on, cls: 'f-rate__tag' + (on ? ' is-on' : ''), toggle: () => this.setState(x => ({ tags: { ...x.tags, [t]: !on } })) }; }),
      comment: s.comment, setComment: e => this.setState({ comment: e.target.value.slice(0, 500) }), commentCount: s.comment.length + ' / 500',
      commentPh: good ? 'Что особенно понравилось? Можно похвалить повара или курьера' : 'Расскажите, что случилось — мы разберёмся и свяжемся с вами',
      ratedSub: s.stars <= 3 ? 'Менеджер ресторана свяжется с вами в течение часа' : 'Передали команде ресторана',
      send: () => {
        const r = { stars: s.stars, tags: Object.keys(s.tags).filter(k => s.tags[k]), comment: s.comment.trim(), at: Date.now() };
        if (p.orderNo) { const all = readJSON('frito_ratings') || {}; all[p.orderNo] = r; try { localStorage.setItem('frito_ratings', JSON.stringify(all)); } catch (e) {} }
        this.setState({ rated: true }); p.onRated && p.onRated(r);
      },
    };
  }
}
</script>
</body>
</html>
