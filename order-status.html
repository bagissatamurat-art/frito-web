<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Заказ оформлен — Frito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./frito-i18n.js"></script>
<link rel="stylesheet" href="./frito.css">
<style>
/* Страничные стили — только раскладка; цвета, радиусы, кнопки и шапка — из frito.css */
*{box-sizing:border-box}
body{margin:0;background:var(--surface-1);font-family:var(--font);color:var(--ink)}
a{color:inherit;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,48px) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:24px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;animation:frito-rise .4s var(--ease) both}
.hero .f-badge{align-self:center}
h1{margin:6px 0 0;font-size:clamp(28px,6vw,34px);font-weight:800;letter-spacing:-.03em}
.sub{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2);max-width:400px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--border);border-radius:var(--r-pill);padding:4px}
.seg button{height:var(--h-md);border:0;border-radius:var(--r-pill);background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface-0);color:var(--ink);box-shadow:var(--shadow-xs)}
.card{background:var(--surface-0);border-radius:var(--r-xl);padding:8px;display:flex;flex-direction:column;gap:2px}
.card .f-overline{padding:10px 8px 6px}
.list{animation:frito-fade .25s ease-out both}
.row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r-md-plus);transition:background-color .15s,transform .15s}
.row:hover{background:var(--surface-1)}
.row:active{transform:scale(.99)}
.num{width:36px;height:36px;font-size:14px;font-weight:800}
.dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot i{width:10px;height:10px;border-radius:50%;display:block}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-size:16px;font-weight:700}
.txt span{font-size:13px;color:var(--ink-2);line-height:1.35}
.chev{color:#C4C4CF;flex-shrink:0}
</style>
</head>
<body>
<header class="f-header">
  <a class="f-header__brand" href="menu.dc.html" aria-label="Frito — на главную"><img class="f-logo" src="https://frito.kz/brand.svg" alt="FRITO" width="109" height="34"></a>
  <div class="f-header__right"><a class="f-header__back" href="menu.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>В меню</a></div>
</header>
<main>
  <section class="hero">
    <span class="f-success"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <h1>Заказ оформлен</h1>
    <p class="sub">Выберите, какой экран статуса заказа показать.</p>
    <span class="f-badge f-badge--warn">Демо-режим</span>
  </section>

  <div class="seg" role="group" aria-label="Способ получения">
    <button type="button" data-mode="delivery" aria-pressed="true">Доставка</button>
    <button type="button" data-mode="pickup" aria-pressed="false">Самовывоз</button>
  </div>

  <section class="card">
    <div class="f-overline">ЭТАПЫ ЗАКАЗА</div>
    <div class="list" id="stages"></div>
  </section>

  <section class="card">
    <div class="f-overline">ОСОБЫЕ СЛУЧАИ</div>
    <div class="list" id="issues"></div>
  </section>

  <a class="f-btn f-btn--outline f-btn--block" style="font-size:15px" id="auto" href="status.dc.html?demo=1">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
    Показать все этапы по очереди
  </a>
</main>

<script>
const STAGES = {
  delivery: [
    ['accepted', 'Принят', 'Заказ у нас, проверяем оплату'],
    ['paid', 'Оплачен', 'Kaspi подтвердил оплату'],
    ['cooking', 'Готовим', 'Повара жарят курочку'],
    ['onway', 'Курьер в пути', 'Везём в термосумке'],
    ['done', 'Доставлен', 'Приятного аппетита + оценка заказа'],
  ],
  pickup: [
    ['accepted', 'Принят', 'Заказ у нас, проверяем оплату'],
    ['paid', 'Оплачен', 'Kaspi подтвердил оплату'],
    ['cooking', 'Готовим', 'Повара жарят курочку'],
    ['onway', 'Готов к выдаче', 'Держим горячим, ждём вас'],
    ['done', 'Выдан', 'Приятного аппетита + оценка заказа'],
  ],
};
const ISSUES = [
  ['delayed', 'cooking', 'Задерживается', 'Заказ готовится дольше обычного', 'var(--warn)', '#FEF3C7'],
  ['paymentFailed', 'paid', 'Оплата не прошла', 'Предложим повторить оплату', 'var(--danger)', '#FEE2E2'],
  ['cancelled', 'accepted', 'Заказ отменён', 'Экран отмены и возврата', 'var(--ink-2)', 'var(--surface-2)'],
];
const chev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const url = q => 'status.dc.html?' + new URLSearchParams(q);
let mode = new URLSearchParams(location.search).get('mode') === 'pickup' ? 'pickup' : 'delivery';

function render() {
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  const st = document.getElementById('stages'), is = document.getElementById('issues');
  st.innerHTML = STAGES[mode].map(([stage, t, d], i) =>
    `<a class="row" href="${url({ mode, stage })}"><span class="f-icon num">${i + 1}</span><span class="txt"><b>${t}</b><span>${d}</span></span>${chev}</a>`).join('');
  is.innerHTML = ISSUES.map(([issue, stage, t, d, c, bg]) =>
    `<a class="row" href="${url({ mode, stage, issue })}"><span class="dot" style="background:${bg}"><i style="background:${c}"></i></span><span class="txt"><b>${t}</b><span>${d}</span></span>${chev}</a>`).join('');
  document.getElementById('auto').href = url({ mode, demo: 1 });
  // перезапуск анимации появления списка
  [st, is].forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; });
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; render(); }));
render();
</script>
</body>
</html>
